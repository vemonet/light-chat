# Pathogen Data Network agent with OpenRouter models, the OpenRouter key is in `pdn-agent/.env` (OPENAI_API_KEY): docker compose up -d --build
name: pdn-agent
services:
  pdn-agent:
    build:
      context: ..
      dockerfile: pdn-agent/Dockerfile
    env_file: .env
    # Override `.env`, the first model is the default
    environment:
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      MODELS: deepseek/deepseek-v4.1-flash,mistralai/mistral-large-4-0,anthropic/claude-haiku-5.5,openai/gpt-6-luna
    ports:
      - "8084:8000"
    restart: unless-stopped
