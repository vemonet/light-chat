<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: -4px 0 10px;
      }
      .chip {
        padding: 0 6px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-size: 11px;
        line-height: 17px;
      }
      .layout {
        display: grid;
        grid-template-columns: 180px minmax(0, 1fr);
        gap: 12px;
      }
      @media (max-width: 600px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .facets {
          max-height: 200px;
        }
      }
      .facets {
        font-size: 12px;
        max-height: 450px;
        overflow-y: auto;
      }
      .facets h2 {
        display: flex;
        font-size: 12px;
        margin: 10px 0 4px;
        color: var(--muted);
        font-weight: 600;
      }
      .facets h2:first-child {
        margin-top: 0;
      }
      .facets h2 a {
        margin-left: auto;
        font-weight: 400;
      }
      .facets label {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 1px 0;
        cursor: pointer;
      }
      .facets label span:first-of-type {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .facets .more {
        font-size: 11px;
      }
      .toolbar {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
      }
      .toolbar input {
        flex: 1;
        min-width: 0;
      }
      .scroll {
        max-height: 440px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      :root[data-mode="fullscreen"] .scroll,
      :root[data-mode="fullscreen"] .facets {
        max-height: calc(100vh - 150px);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        padding: 5px 8px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--panel);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        z-index: 1;
      }
      th[data-dir="asc"]::after {
        content: " \25B2";
      }
      th[data-dir="desc"]::after {
        content: " \25BC";
      }
      td.name {
        min-width: 240px;
        width: 50%;
        overflow-wrap: anywhere;
      }
      td.name a {
        font-weight: 500;
      }
      /* Description cut to 2 lines, full text in the tooltip */
      .desc {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      td.list {
        min-width: 90px;
        max-width: 170px;
        overflow-wrap: anywhere;
      }
      td.nowrap {
        white-space: nowrap;
      }
      .sub {
        font-size: 11px;
      }
      tbody tr {
        cursor: pointer;
      }
      tbody tr:hover,
      tr.selected {
        background: var(--hover);
      }
      .selection {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 8px;
      }
      .selection input {
        flex: 1;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Loading datasets</h1>
      <span class="muted" id="subtitle"></span>
      <span class="spacer"></span>
      <button type="button" id="fullscreen">Full screen</button>
    </header>
    <div class="filters" id="filters"></div>
    <div class="layout">
      <div class="facets" id="facets"></div>
      <div>
        <div class="toolbar">
          <input id="filter" type="search" placeholder="Filter by name, description, pathogen, species, id" />
        </div>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th data-col="selected"><input type="checkbox" id="all" aria-label="Select all shown" /></th>
                <th data-col="name">Dataset</th>
                <th data-col="repository">Repository</th>
                <th data-col="pathogens">Pathogens</th>
                <th data-col="species">Species</th>
                <th data-col="date">Date</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="selection">
      <span id="count" class="muted">No selection</span>
      <input id="prompt" placeholder="Summarize these datasets" />
      <button type="button" class="primary" id="send" disabled>Send</button>
    </div>

    <script src="colors.js"></script>
    <script type="module">
      import {
        App,
        applyDocumentTheme,
        applyHostFonts,
        applyHostStyleVariables,
      } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@2.0.3/dist/src/app-with-deps.js";

      // Connection to the host with the MCP Apps SDK
      const app = new App(
        { name: "NDE search results", version: "0.0.1" },
        { availableDisplayModes: ["inline", "fullscreen"] },
      );
      const sendMessage = (text) => app.sendMessage({ role: "user", content: [{ type: "text", text }] });
      const updateContext = (text) => app.updateModelContext({ content: [{ type: "text", text }] });

      const $ = (id) => document.getElementById(id);
      let rows = [];
      let data;
      const selected = new Set();
      // Rows shown, selected by the header checkbox
      let shownIds = [];
      // Facet values checked (OR-ed), none checked means no filter
      const FACETS = {
        repository: { title: "Repository", limit: 10, values: (r) => [r.repository ?? "Unknown"] },
        pathogens: { title: "Pathogen", limit: 10, values: (r) => (r.pathogens.length ? r.pathogens : ["None"]) },
        species: { title: "Species", limit: 8, values: (r) => (r.species.length ? r.species : ["None"]) },
        year: {
          title: "Year",
          limit: 10,
          values: (r) => [/^\d{4}/.test(r.date ?? "") ? r.date.slice(0, 4) : "Unknown"],
        },
        techniques: { title: "Technique", limit: 6, values: (r) => (r.techniques.length ? r.techniques : ["None"]) },
      };
      const facets = Object.fromEntries(Object.keys(FACETS).map((k) => [k, new Set()]));
      const expanded = new Set();
      const matches = (key, r) => !facets[key].size || FACETS[key].values(r).some((v) => facets[key].has(v));
      let sort = { col: null, dir: 1 };

      const filtered = () => {
        const text = $("filter").value.toLowerCase();
        return rows.filter(
          (r) =>
            Object.keys(facets).every((k) => matches(k, r)) &&
            (!text ||
              [
                r.id,
                r.name,
                r.description,
                r.repository,
                ...r.pathogens,
                ...r.species,
                ...r.conditions,
                ...r.techniques,
              ]
                .join(" ")
                .toLowerCase()
                .includes(text)),
        );
      };

      /** Facet values with their counts among the rows matching the other facets */
      function renderFacets() {
        $("facets").innerHTML = "";
        for (const [key, facet] of Object.entries(FACETS)) {
          const others = rows.filter((r) => Object.keys(facets).every((k) => k === key || matches(k, r)));
          const counts = new Map();
          for (const r of others) for (const v of facet.values(r)) counts.set(v, (counts.get(v) ?? 0) + 1);
          const list = [...counts].sort((a, b) =>
            key === "year"
              ? (a[0] === "Unknown") - (b[0] === "Unknown") || b[0].localeCompare(a[0])
              : b[1] - a[1] || a[0].localeCompare(b[0]),
          );
          // Checked values stay visible when the list is cut
          const limit = expanded.has(key) ? list.length : facet.limit;
          const shown = list.filter(([v], i) => i < limit || facets[key].has(v));
          const clear = facets[key].size ? `<a data-clear="${key}">clear</a>` : "";
          $("facets").insertAdjacentHTML("beforeend", `<h2>${facet.title}${clear}</h2>`);
          for (const [value, n] of shown) {
            const label = document.createElement("label");
            label.title = value;
            label.innerHTML = `<input type="checkbox" ${facets[key].has(value) ? "checked" : ""} />
              <span>${escapeHtml(key === "repository" ? short(value) : value)}</span><span class="muted">${n}</span>`;
            label.querySelector("input").onchange = (e) => {
              e.target.checked ? facets[key].add(value) : facets[key].delete(value);
              render();
            };
            $("facets").append(label);
          }
          if (list.length > facet.limit)
            $("facets").insertAdjacentHTML(
              "beforeend",
              `<a class="more" data-more="${key}">${expanded.has(key) ? "Show less" : `Show all ${list.length}`}</a>`,
            );
        }
      }

      // Short repository name, e.g. NCBI GEO for "NCBI Gene Expression Omnibus (NCBI GEO)"
      const short = (name) => name.match(/\(([^)]+)\)$/)?.[1] ?? name;
      const portalUrl = (id) => data.portal.replace("{_id}", encodeURIComponent(id));
      const list3 = (values) =>
        escapeHtml(values.slice(0, 3).join(", ")) +
        (values.length > 3 ? ` <span class="muted">+${values.length - 3}</span>` : "");

      function renderRows() {
        let list = filtered();
        if (sort.col) {
          const key = (r) =>
            sort.col === "selected"
              ? +selected.has(r.id)
              : Array.isArray(r[sort.col])
                ? (r[sort.col][0] ?? "")
                : (r[sort.col] ?? "");
          list = [...list].sort((a, b) => {
            const [x, y] = [key(a), key(b)];
            return (typeof x === "string" ? x.localeCompare(y) : x - y) * sort.dir;
          });
        }
        $("rows").innerHTML = list
          .map(
            (r) => `<tr class="${selected.has(r.id) ? "selected" : ""}" data-id="${escapeHtml(r.id)}">
              <td><input type="checkbox" ${selected.has(r.id) ? "checked" : ""} aria-label="Select ${escapeHtml(r.id)}" /></td>
              <td class="name"><a data-url="${escapeHtml(portalUrl(r.id))}" title="Open in the NDE portal">${escapeHtml(r.name ?? r.id)}</a>
                <div class="desc" title="${escapeHtml(r.description ?? "")}">${escapeHtml(r.description ?? "")}</div></td>
              <td class="list" title="${escapeHtml(r.repository ?? "")}">${escapeHtml(short(r.repository ?? ""))}
                ${r.url ? `<div class="sub"><a data-url="${escapeHtml(r.url)}" title="${escapeHtml(r.url)}">source record</a></div>` : ""}</td>
              <td class="list">${list3(r.pathogens)}</td>
              <td class="list">${list3(r.species)}</td>
              <td class="nowrap">${escapeHtml(r.date ?? "")}</td></tr>`,
          )
          .join("");
        $("subtitle").textContent = `${list.length} of ${rows.length} loaded (${data.total.toLocaleString()} in NDE)`;
        $("all").checked = list.length > 0 && list.every((r) => selected.has(r.id));
        shownIds = list.map((r) => r.id);
      }

      function render() {
        renderFacets();
        renderRows();
      }

      const describe = (r) =>
        `${r.id} "${r.name}" (${r.repository ?? "-"}, ${r.date ?? "-"}` +
        (r.pathogens.length ? `, pathogens: ${r.pathogens.join(", ")}` : "") +
        (r.species.length ? `, species: ${r.species.join(", ")}` : "") +
        (r.techniques.length ? `, techniques: ${r.techniques.join(", ")}` : "") +
        (r.url ? `, ${r.url}` : "") +
        ")";

      /** Selected rows, told to the model with the next message */
      function selectionChanged() {
        const list = rows.filter((r) => selected.has(r.id));
        $("count").textContent = list.length ? `${list.length} selected` : "No selection";
        $("send").disabled = !list.length;
        const text = list.length
          ? `The user selected ${list.length} records in the NDE search results table: ` + list.map(describe).join("; ")
          : "The user has not selected records in the NDE search results table";
        void updateContext(text);
      }

      $("rows").addEventListener("click", (e) => {
        const a = e.target.closest("a[data-url]");
        if (a) return void app.openLink({ url: a.dataset.url });
        const tr = e.target.closest("tr");
        if (!tr) return;
        const id = tr.dataset.id;
        selected.has(id) ? selected.delete(id) : selected.add(id);
        tr.classList.toggle("selected", selected.has(id));
        tr.querySelector("input").checked = selected.has(id);
        selectionChanged();
      });
      $("facets").addEventListener("click", (e) => {
        const { more, clear } = e.target.dataset ?? {};
        if (more) expanded.has(more) ? expanded.delete(more) : expanded.add(more);
        if (clear) facets[clear].clear();
        if (more || clear) render();
      });
      $("all").onclick = (e) => {
        e.stopPropagation();
        for (const id of shownIds) e.target.checked ? selected.add(id) : selected.delete(id);
        renderRows();
        selectionChanged();
      };
      document.querySelector("thead").addEventListener("click", (e) => {
        const th = e.target.closest("th");
        if (!th || e.target.id === "all") return;
        sort = { col: th.dataset.col, dir: sort.col === th.dataset.col ? -sort.dir : 1 };
        for (const h of document.querySelectorAll("th")) delete h.dataset.dir;
        th.dataset.dir = sort.dir > 0 ? "asc" : "desc";
        renderRows();
      });
      $("filter").oninput = renderRows;
      $("send").onclick = () => {
        const list = rows.filter((r) => selected.has(r.id));
        const prompt = $("prompt").value.trim() || "Summarize these datasets";
        void sendMessage(`${prompt}: ${list.map((r) => `${r.id} (${r.name})`).join(", ")}`);
        $("prompt").value = "";
      };
      // Block body: a handler returning false would cancel every key typed
      $("prompt").onkeydown = (e) => {
        if (e.key === "Enter" && !$("send").disabled) $("send").click();
      };
      // Theme and display mode of the host as attributes on <html> for the CSS
      function onContext(ctx) {
        if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
        if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
        if (ctx.theme) applyDocumentTheme(ctx.theme);
        if (ctx.displayMode) {
          document.documentElement.dataset.mode = ctx.displayMode;
          $("fullscreen").textContent = ctx.displayMode === "fullscreen" ? "Exit full screen" : "Full screen";
        }
      }
      app.onhostcontextchanged = onContext;
      // The host answers with the mode set, it may not send a context change
      $("fullscreen").onclick = async () => {
        const mode = document.documentElement.dataset.mode === "fullscreen" ? "inline" : "fullscreen";
        onContext({ displayMode: (await app.requestDisplayMode({ mode })).mode });
      };

      // Tool arguments, to call the tool again when the result has no `structuredContent`, as Claude Desktop
      // gives to widgets restored after a reload of the chat
      let toolArgs;
      app.ontoolinput = (params) => (toolArgs = params.arguments);
      app.ontoolresult = async (result) => {
        if (!result.structuredContent && !result.isError && toolArgs) {
          result = await app.callServerTool({ name: "search_datasets_table", arguments: toolArgs }).catch(() => result);
        }
        data = result.structuredContent;
        if (!data) return ($("title").textContent = "No results");
        rows = data.rows;
        // Free-text query as title, the other search arguments as chips
        const { query, ...filters } = data.filters;
        $("title").textContent = query ? `NDE: ${query}` : "NDE records";
        $("title").title = data.query;
        $("filters").innerHTML = Object.entries(filters)
          .map(([k, v]) => `<span class="chip">${escapeHtml(k)}: ${escapeHtml(v)}</span>`)
          .join("");
        render();
      };

      await app.connect();
      // Full screen button only when the host offers it
      const host = app.getHostContext() ?? {};
      $("fullscreen").hidden = Boolean(
        host.availableDisplayModes && !host.availableDisplayModes.includes("fullscreen"),
      );
      onContext(host);
    </script>
  </body>
</html>
