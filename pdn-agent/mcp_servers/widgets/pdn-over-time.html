<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      /* Long filters stay on one line, in full on hover */
      #subtitle {
        flex: 1 1 0;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Categorical palette, light and dark steps of the same hues */
      :root {
        --s1: #2a78d6;
        --s2: #eb6834;
        --s3: #1baf7a;
        --s4: #eda100;
        --s5: #e87ba4;
        --s6: #008300;
        --s7: #4a3aa7;
        --s8: #e34948;
        --grid: #e1e0d9;
        --axis: #c3c2b7;
      }
      :root[data-theme="dark"] {
        --s1: #3987e5;
        --s2: #d95926;
        --s3: #199e70;
        --s4: #c98500;
        --s5: #d55181;
        --s6: #008300;
        --s7: #9085e9;
        --s8: #e66767;
        --grid: #2c2c2a;
        --axis: #383835;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        margin-bottom: 6px;
        font-size: 12px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      .legend label,
      .toolbar > label {
        display: flex;
        gap: 5px;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .legend label.off {
        opacity: 0.45;
      }
      .legend i {
        width: 14px;
        height: 3px;
        border-radius: 2px;
      }
      .legend input,
      .toolbar input {
        margin: 0;
      }
      .legend small {
        color: var(--muted);
      }
      #chart {
        position: relative;
      }
      svg {
        display: block;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      svg text {
        fill: var(--muted);
      }
      svg .label {
        fill: var(--fg);
        font-weight: 500;
      }
      .tip {
        position: absolute;
        pointer-events: none;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 9px;
        font-size: 12px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        white-space: nowrap;
        display: none;
        z-index: 2;
      }
      .tip table {
        border-collapse: collapse;
      }
      .tip td {
        padding: 1px 4px;
      }
      .tip td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .tip i {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 4px;
      }
      .details {
        margin-top: 8px;
        padding: 8px 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        min-height: 38px;
      }
      .details .items {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 16px;
      }
      .details .items i {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 5px;
      }
      .details .actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Loading frequencies</h1>
      <span class="muted" id="subtitle"></span>
      <button type="button" id="fullscreen">Full screen</button>
    </header>
    <div class="toolbar">
      <div class="legend" id="legend"></div>
      <span class="spacer"></span>
      <label><input type="checkbox" id="band" checked /> 95% interval</label>
    </div>
    <div id="chart"><div class="tip" id="tip"></div></div>
    <div class="details muted" id="details">Hover the chart for values, click a period for details</div>

    <script src="colors.js"></script>
    <script type="module">
      import {
        App,
        applyDocumentTheme,
      } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@2.0.3/dist/src/app-with-deps.js";

      // Connection to the host with the MCP Apps SDK
      const app = new App(
        { name: "LAPIS mutations over time", version: "0.0.1" },
        { availableDisplayModes: ["inline", "fullscreen"] },
      );
      const sendMessage = (text) => app.sendMessage({ role: "user", content: [{ type: "text", text }] });
      const updateContext = (text) => app.updateModelContext({ content: [{ type: "text", text }] });

      const $ = (id) => document.getElementById(id);
      const NS = "http://www.w3.org/2000/svg";
      const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      let data;
      let hidden = new Set();
      let selected = null;
      let layout = null;

      const color = (i) => `var(--s${(i % 8) + 1})`;
      const pct = (p) => (p == null ? "-" : `${(p * 100).toFixed(p > 0 && p < 0.001 ? 2 : 1)}%`);
      const num = (n) => n.toLocaleString("en-US");
      const compact = (n) => n.toLocaleString("en-US", { notation: "compact" });
      /** Period label by interval: "Mar 2024", "Q2 2024" or "2024" */
      function periodLabel(p, short = false) {
        const [y, m] = p.start.split("-").map(Number);
        if (data.interval === "year") return `${y}`;
        if (data.interval === "quarter")
          return `Q${Math.floor((m - 1) / 3) + 1} ${short ? `'${String(y).slice(2)}` : y}`;
        return short ? `${MONTHS[m - 1]} '${String(y).slice(2)}` : `${MONTHS[m - 1]} ${y}`;
      }
      const filtersText = () =>
        Object.entries(data.filters)
          .filter(([k]) => k !== "versionStatus" && k !== "isRevocation")
          .map(([k, v]) => `${k}=${Array.isArray(v) ? v.join("|") : v}`)
          .join(", ");

      function el(tag, attrs, parent) {
        const e = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        parent?.appendChild(e);
        return e;
      }

      /** Line chart of the proportions with a confidence band, and a strip of the sequences per period below */
      function render() {
        const box = $("chart");
        box.querySelector("svg")?.remove();
        const W = Math.max(320, box.clientWidth);
        const full = document.documentElement.dataset.mode === "fullscreen";
        const H = full ? Math.max(360, innerHeight - 190) : 380;
        const series = data.series.map((s, i) => ({ ...s, i })).filter((s) => !hidden.has(s.name));
        const labelled = series.length <= 4;
        const m = { top: 12, right: labelled ? 92 : 16, bottom: 26, left: 44 };
        const stripH = 46;
        const plotH = H - m.top - m.bottom - stripH - 18;
        const n = data.periods.length;
        const step = (W - m.left - m.right) / n;
        const x = (i) => m.left + (i + 0.5) * step;
        const y = (p) => m.top + plotH * (1 - p);
        const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
        box.prepend(svg);

        // Grid and y axis, in percent
        for (const t of [0, 0.25, 0.5, 0.75, 1]) {
          el(
            "line",
            { x1: m.left, x2: W - m.right, y1: y(t), y2: y(t), stroke: t ? "var(--grid)" : "var(--axis)" },
            svg,
          );
          el("text", { x: m.left - 6, y: y(t) + 4, "text-anchor": "end" }, svg).textContent = `${t * 100}%`;
        }
        // x labels, thinned to fit
        const every = Math.ceil(n / Math.max(1, Math.floor((W - m.left - m.right) / 58)));
        data.periods.forEach((p, i) => {
          if (i % every) return;
          el("text", { x: x(i), y: H - 8, "text-anchor": "middle" }, svg).textContent = periodLabel(p, true);
        });

        // Bands, then lines and points, split where a period has no coverage
        const runs = (s) => {
          const out = [[]];
          s.proportion.forEach((p, i) => (p == null ? out.push([]) : out.at(-1).push(i)));
          return out.filter((r) => r.length);
        };
        if ($("band").checked) {
          for (const s of series)
            for (const r of runs(s)) {
              const pts = [
                ...r.map((i) => [x(i), y(s.upper[i])]),
                ...[...r].reverse().map((i) => [x(i), y(s.lower[i])]),
              ];
              const d = r.length === 1 ? null : `M${pts.map((p) => p.join(",")).join("L")}Z`;
              if (d) el("path", { d, fill: color(s.i), "fill-opacity": 0.13, stroke: "none" }, svg);
              else
                el(
                  "line",
                  {
                    x1: x(r[0]),
                    x2: x(r[0]),
                    y1: y(s.upper[r[0]]),
                    y2: y(s.lower[r[0]]),
                    stroke: color(s.i),
                    "stroke-opacity": 0.35,
                    "stroke-width": 6,
                    "stroke-linecap": "round",
                  },
                  svg,
                );
            }
        }
        for (const s of series) {
          for (const r of runs(s)) {
            const d = `M${r.map((i) => `${x(i)},${y(s.proportion[i])}`).join("L")}`;
            el("path", { d, fill: "none", stroke: color(s.i), "stroke-width": 2, "stroke-linejoin": "round" }, svg);
          }
          s.proportion.forEach((p, i) => {
            if (p == null) return;
            el(
              "circle",
              { cx: x(i), cy: y(p), r: 3.5, fill: color(s.i), stroke: "var(--bg)", "stroke-width": 1.5 },
              svg,
            );
          });
        }

        // Direct labels at the last point of each line, pushed apart to avoid overlaps
        if (labelled) {
          const ends = series
            .map((s) => {
              const i = s.proportion.findLastIndex((p) => p != null);
              return i < 0 ? null : { s, i, y: y(s.proportion[i]) };
            })
            .filter(Boolean)
            .sort((a, b) => a.y - b.y);
          // Push down from the top, then back up from the baseline so no label falls below the plot
          ends.forEach((e, k) => k && (e.y = Math.max(e.y, ends[k - 1].y + 13)));
          for (let k = ends.length - 1; k >= 0; k--)
            ends[k].y = Math.min(ends[k].y, k === ends.length - 1 ? y(0) : ends[k + 1].y - 13);
          for (const e of ends) {
            const t = el("text", { x: x(n - 1) + 9, y: e.y + 4, class: "label" }, svg);
            t.textContent = e.s.name.length > 13 ? `${e.s.name.slice(0, 12)}...` : e.s.name;
          }
        }

        // Sequences per period: the n behind each proportion
        const stripTop = m.top + plotH + 18;
        const maxTotal = Math.max(1, ...data.periods.map((p) => p.total));
        // Sequences axis: the largest period total, at the top of the strip
        el("text", { x: m.left - 6, y: stripTop + 8, "text-anchor": "end" }, svg).textContent = compact(maxTotal);
        el("text", { x: m.left - 6, y: stripTop + stripH - 8, "text-anchor": "end" }, svg).textContent = "seqs";
        data.periods.forEach((p, i) => {
          const h = (stripH - 6) * (p.total / maxTotal);
          el(
            "rect",
            {
              x: x(i) - Math.min(step * 0.35, 14),
              y: stripTop + stripH - 6 - h,
              width: Math.min(step * 0.7, 28),
              height: Math.max(h, p.total ? 1 : 0),
              rx: 2,
              fill: "var(--muted)",
              "fill-opacity": 0.35,
            },
            svg,
          );
        });
        el(
          "line",
          { x1: m.left, x2: W - m.right, y1: stripTop + stripH - 6, y2: stripTop + stripH - 6, stroke: "var(--axis)" },
          svg,
        );

        // Crosshair and selection marker
        const cross = el(
          "line",
          {
            y1: m.top,
            y2: stripTop + stripH - 6,
            stroke: "var(--muted)",
            "stroke-dasharray": "3 3",
            visibility: "hidden",
          },
          svg,
        );
        if (selected != null)
          svg.prepend(
            el("rect", {
              x: x(selected) - step / 2,
              y: m.top,
              width: step,
              height: stripTop + stripH - 6 - m.top,
              fill: "var(--hover)",
            }),
          );
        layout = { x, step, m, W, cross, series };
      }

      /** Index of the period under the pointer */
      const periodAt = (e) => {
        const r = $("chart").getBoundingClientRect();
        const i = Math.floor((e.clientX - r.left - layout.m.left) / layout.step);
        return i >= 0 && i < data.periods.length ? i : null;
      };

      function showTip(e) {
        const i = periodAt(e);
        const tip = $("tip");
        if (i == null) return hideTip();
        const p = data.periods[i];
        layout.cross.setAttribute("x1", layout.x(i));
        layout.cross.setAttribute("x2", layout.x(i));
        layout.cross.setAttribute("visibility", "visible");
        const rows = layout.series
          .map(
            (s) => `<tr><td><i style="background:${color(s.i)}"></i>${escapeHtml(s.name)}</td>
              <td class="num"><b>${pct(s.proportion[i])}</b></td>
              <td class="num muted">${s.lower[i] == null ? "" : `${pct(s.lower[i])} - ${pct(s.upper[i])}`}</td>
              <td class="num muted">${num(s.count[i])} / ${num(s.coverage[i])}</td></tr>`,
          )
          .join("");
        tip.innerHTML = `<b>${periodLabel(p)}</b> <span class="muted">· ${num(p.total)} sequences</span>
          <table><tr class="muted"><td></td><td class="num">share</td><td class="num">95% interval</td><td class="num">with / covered</td></tr>${rows}</table>`;
        tip.style.display = "block";
        const r = $("chart").getBoundingClientRect();
        const left = layout.x(i) + 14;
        tip.style.left = `${left + tip.offsetWidth > r.width ? layout.x(i) - tip.offsetWidth - 14 : left}px`;
        tip.style.top = `${Math.max(0, e.clientY - r.top - tip.offsetHeight / 2)}px`;
      }
      function hideTip() {
        $("tip").style.display = "none";
        layout?.cross.setAttribute("visibility", "hidden");
      }

      /** Details of a period, also told to the model */
      function select(i) {
        selected = i;
        render();
        const p = data.periods[i];
        const lines = data.series.map(
          (s) =>
            `${s.name} ${pct(s.proportion[i])} (${s.count[i]} of ${s.coverage[i]}, 95% interval ${pct(s.lower[i])} - ${pct(s.upper[i])})`,
        );
        $("details").classList.remove("muted");
        const items = data.series.map(
          (s, k) => `<span><i style="background:${color(k)}"></i><b>${escapeHtml(s.name)}</b> ${pct(s.proportion[i])}
            <span class="muted">(${num(s.count[i])} of ${num(s.coverage[i])}, ${pct(s.lower[i])} - ${pct(s.upper[i])})</span></span>`,
        );
        $("details").innerHTML =
          `<div><b>${periodLabel(p)}</b> <span class="muted">${p.start} to ${p.end} · ${num(p.total)} sequences</span></div>
          <div class="items">${items.join("")}</div>
          <div class="actions"><button type="button" id="ask">Ask about this period</button></div>`;
        const where = filtersText();
        $("ask").onclick = () =>
          sendMessage(
            `What explains the frequencies of ${data.series.map((s) => s.name).join(", ")} in ${data.organism}` +
              `${where ? ` (${where})` : ""} in ${periodLabel(p)}?`,
          );
        void updateContext(
          `The user selected ${periodLabel(p)} (${p.start} to ${p.end}, ${p.total} sequences) in the chart of ` +
            `${data.organism} frequencies over time: ${lines.join("; ")}`,
        );
      }

      function renderLegend() {
        $("legend").innerHTML = data.series
          .map(
            (s, i) => `<label class="${hidden.has(s.name) ? "off" : ""}" title="${s.kind}">
              <input type="checkbox" data-name="${escapeHtml(s.name)}" ${hidden.has(s.name) ? "" : "checked"} />
              <i style="background:${color(i)}"></i>${escapeHtml(s.name)} <small>${s.kind}</small></label>`,
          )
          .join("");
      }

      $("legend").addEventListener("change", (e) => {
        const name = e.target.dataset.name;
        if (e.target.checked) hidden.delete(name);
        else hidden.add(name);
        renderLegend();
        render();
      });
      $("band").onchange = render;
      $("chart").addEventListener("mousemove", (e) => layout && showTip(e));
      $("chart").addEventListener("mouseleave", hideTip);
      $("chart").addEventListener("click", (e) => {
        const i = layout && periodAt(e);
        if (i != null) select(i);
      });
      // Theme and display mode of the host as attributes on <html> for the CSS
      function onContext(ctx) {
        if (ctx.theme) applyDocumentTheme(ctx.theme);
        if (ctx.displayMode) {
          document.documentElement.dataset.mode = ctx.displayMode;
          $("fullscreen").textContent = ctx.displayMode === "fullscreen" ? "Exit full screen" : "Full screen";
        }
        if (data) render();
      }
      app.onhostcontextchanged = onContext;
      // The host answers with the mode set, it may not send a context change
      $("fullscreen").onclick = async () => {
        const mode = document.documentElement.dataset.mode === "fullscreen" ? "inline" : "fullscreen";
        onContext({ displayMode: (await app.requestDisplayMode({ mode })).mode });
      };
      new ResizeObserver(() => data && render()).observe($("chart"));

      // Tool arguments, to call the tool again when the result has no `structuredContent`, as Claude Desktop
      // gives to widgets restored after a reload of the chat
      let toolArgs;
      app.ontoolinput = (params) => (toolArgs = params.arguments);
      app.ontoolresult = async (result) => {
        if (!result.structuredContent && !result.isError && toolArgs) {
          result = await app
            .callServerTool({ name: "show_lapis_mutations_over_time", arguments: toolArgs })
            .catch(() => result);
        }
        data = result.structuredContent;
        if (!data?.series) return ($("title").textContent = "No data");
        const kinds = [...new Set(data.series.map((s) => `${s.kind}s`))].join(" and ");
        $("title").textContent = `Frequency of ${kinds} over time`;
        const first = data.periods[0];
        const last = data.periods.at(-1);
        const where = filtersText();
        $("subtitle").title = $("subtitle").textContent =
          `${data.organism} · ${data.database}${where ? ` · ${where}` : ""} · ${periodLabel(first)} - ${periodLabel(last)} by ${data.date_field}`;
        renderLegend();
        render();
      };

      await app.connect();
      // Full screen button only when the host offers it
      const host = app.getHostContext() ?? {};
      $("fullscreen").hidden = Boolean(
        host.availableDisplayModes && !host.availableDisplayModes.includes("fullscreen"),
      );
      onContext(host);
    </script>
  </body>
</html>
