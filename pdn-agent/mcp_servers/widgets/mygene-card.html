<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      :root {
        --chrom: #d8dee4;
        --exon: #4c8bf5;
        --mark: #e5484d;
      }
      :root[data-theme="dark"] {
        --chrom: #30363d;
        --mark: #ff6369;
      }
      h1 .sub {
        font-weight: 400;
        color: var(--muted);
      }
      .species {
        font-style: italic;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
        gap: 10px;
      }
      section {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        background: var(--panel);
        min-width: 0;
      }
      section.wide {
        grid-column: 1 / -1;
      }
      section h2 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      section h2 span {
        text-transform: none;
        letter-spacing: 0;
        font-weight: 400;
      }
      .summary {
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .summary.open {
        display: block;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .chips b {
        color: var(--fg);
        font-weight: 600;
      }
      svg {
        display: block;
        overflow: visible;
      }
      svg text {
        fill: var(--muted);
        font: 11px var(--font-sans, system-ui, sans-serif);
      }
      .drawings {
        margin-top: 10px;
      }
      .karyo {
        margin-bottom: 4px;
        display: flex;
        justify-content: center;
      }
      h2.sub-h {
        margin-top: 12px;
      }
      svg text.strong {
        fill: var(--fg);
        font-weight: 600;
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 12px;
        margin-top: 4px;
      }
      .facts span {
        color: var(--muted);
      }
      .facts b {
        color: var(--fg);
        font-weight: 500;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 8px;
      }
      .tiles button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 6px 8px;
        text-align: left;
        border-radius: 6px;
      }
      .tiles button.active {
        border-color: var(--accent);
        background: var(--hover);
      }
      .tiles b {
        font-size: 18px;
        line-height: 1.1;
      }
      .tiles span {
        font-size: 11px;
        color: var(--muted);
      }
      .go-tools {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .go-tools input[type="search"] {
        flex: 1;
        min-width: 0;
        padding: 2px 8px;
      }
      .go-tools label {
        display: flex;
        gap: 4px;
        align-items: center;
        white-space: nowrap;
      }
      .terms {
        max-height: 230px;
        overflow-y: auto;
        font-size: 12px;
      }
      .terms div {
        display: flex;
        gap: 8px;
        padding: 2px 0;
        border-top: 1px solid var(--border);
        cursor: pointer;
      }
      .terms div:hover {
        background: var(--hover);
      }
      .terms .t {
        flex: 1;
        min-width: 0;
      }
      .terms .ev {
        color: var(--muted);
        font-family: var(--font-mono, ui-monospace, Menlo, monospace);
        font-size: 11px;
        white-space: nowrap;
      }
      .terms .exp {
        color: var(--accent);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      td,
      th {
        text-align: left;
        padding: 3px 6px 3px 0;
        border-top: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        font-weight: 500;
        border-top: 0;
      }
      td button {
        font-size: 11px;
        padding: 0 6px;
      }
      .empty {
        color: var(--muted);
        font-size: 12px;
      }
      .actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Loading the gene</h1>
      <span class="muted" id="subtitle"></span>
      <span class="spacer"></span>
      <div class="links" id="links"></div>
    </header>
    <div class="grid" id="card"></div>
    <div class="actions" id="actions"></div>

    <script type="module">
      import { App, applyDocumentTheme, applyHostFonts, applyHostStyleVariables } from "@modelcontextprotocol/ext-apps";
      import { escapeHtml } from "./colors.js";
      import { logoHtml } from "./logos.js";

      // Connection to the host with the MCP Apps SDK
      const app = new App(
        { name: "MyGene card", version: "0.0.1" },
        { availableDisplayModes: ["inline", "fullscreen"] },
      );
      const sendMessage = (text) => app.sendMessage({ role: "user", content: [{ type: "text", text }] });

      const $ = (id) => document.getElementById(id);
      const ASPECTS = { BP: "Biological process", MF: "Molecular function", CC: "Cellular component" };
      const PATHWAYS = {
        kegg: "KEGG",
        reactome: "Reactome",
        wikipathways: "WikiPathways",
        biocarta: "BioCarta",
        pid: "PID",
        smpdb: "SMPDB",
        netpath: "NetPath",
        humancyc: "HumanCyc",
        yeastcyc: "YeastCyc",
        mousecyc: "MouseCyc",
      };
      let data;
      let aspect = "BP";
      const mb = (bp) => `${(bp / 1e6).toFixed(bp < 1e7 ? 2 : 1)} Mb`;
      const kb = (bp) => (bp >= 1000 ? `${(bp / 1000).toFixed(1)} kb` : `${bp} bp`);
      const fmt = (n) => n.toLocaleString("en-US");

      /** All chromosomes as vertical bars scaled by length, the gene chromosome highlighted with a marker */
      function karyotypeSvg(k, loc, W) {
        const names = Object.keys(k);
        const step = Math.min(34, W / names.length);
        const H = 90;
        const max = Math.max(...names.map((c) => k[c][0]));
        return `<svg viewBox="0 -8 ${W} ${H + 24}" width="${W}" role="img" aria-label="Karyotype">${names
          .map((c, i) => {
            const [len, cen] = k[c];
            const h = (len / max) * H;
            const x = i * step + step / 2 - 4;
            const active = c === loc.chr;
            const fill = active ? "var(--accent)" : "var(--chrom)";
            const cenY = cen ? (cen / len) * h : null;
            const marker = active
              ? `<line x1="${x - 5}" x2="${x + 13}" y1="${((loc.start + loc.end) / 2 / len) * h}" y2="${((loc.start + loc.end) / 2 / len) * h}" stroke="var(--mark)" stroke-width="3" stroke-linecap="round" />`
              : "";
            // Constriction at the centromere
            const pinch =
              cenY != null
                ? `<rect x="${x - 1}" y="${cenY - 1.5}" width="2" height="3" fill="var(--panel)" /><rect x="${x + 7}" y="${cenY - 1.5}" width="2" height="3" fill="var(--panel)" />`
                : "";
            return `<g><title>chr${c} · ${mb(len)}</title><rect x="${x}" y="0" width="8" height="${h}" rx="4" fill="${fill}" />${pinch}${marker}
              <text x="${x + 4}" y="${H + 12}" text-anchor="middle" class="${active ? "strong" : ""}" style="${step < 22 ? "font-size:9px" : ""}">${c}</text></g>`;
          })
          .join("")}</svg>`;
      }

      /** The gene chromosome, horizontal with its arms and ticks, the gene position marked */
      function chromosomeSvg(len, cen, loc, W) {
        const [x0, x1] = [2, W - 2];
        const x = (p) => x0 + (p / len) * (x1 - x0);
        const mid = (loc.start + loc.end) / 2;
        const arms = cen
          ? `<rect x="${x0}" y="22" width="${x(cen) - x0 - 2}" height="16" rx="8" fill="var(--chrom)" />
             <rect x="${x(cen) + 2}" y="22" width="${x1 - x(cen) - 2}" height="16" rx="8" fill="var(--chrom)" />
             <text x="${(x0 + x(cen)) / 2}" y="34" text-anchor="middle">p</text><text x="${(x(cen) + x1) / 2}" y="34" text-anchor="middle">q</text>`
          : `<rect x="${x0}" y="22" width="${x1 - x0}" height="16" rx="8" fill="var(--chrom)" />`;
        const ticks = [0, 0.25, 0.5, 0.75, 1]
          .map(
            (f) =>
              `<text x="${x0 + f * (x1 - x0)}" y="54" text-anchor="${f === 0 ? "start" : f === 1 ? "end" : "middle"}">${mb(f * len)}</text>`,
          )
          .join("");
        const label = `${loc.band ? `${loc.band.split("|")[0]} · ` : ""}${mb(mid)}`;
        const lx = Math.min(Math.max(x(mid), x0 + 60), x1 - 60);
        return `<svg viewBox="0 0 ${W} 58" width="${W}" role="img" aria-label="Chromosome ${escapeHtml(loc.chr)}">${arms}${ticks}
          <rect x="${x(loc.start) - 1.5}" y="18" width="${Math.max(3, x(loc.end) - x(loc.start))}" height="24" rx="1.5" fill="var(--mark)" />
          <text x="${lx}" y="12" text-anchor="middle" class="strong">${escapeHtml(label)}</text></svg>`;
      }

      /** Exons of the transcript as boxes, coding parts taller, introns as a line with strand chevrons */
      function structureSvg(t, strand, W) {
        const [x0, x1] = [2, W - 2];
        const x = (p) => x0 + ((p - t.start) / (t.end - t.start || 1)) * (x1 - x0);
        const chevrons = [];
        for (let cx = x0 + 20; cx < x1 - 10; cx += 40)
          chevrons.push(
            strand < 0
              ? `<path d="M${cx + 3} 17 l-4 4 l4 4" fill="none" stroke="var(--muted)" />`
              : `<path d="M${cx - 3} 17 l4 4 l-4 4" fill="none" stroke="var(--muted)" />`,
          );
        const exons = t.exons
          .map(([s, e], i) => {
            const n = strand < 0 ? t.exons.length - i : i + 1;
            const box = `<rect x="${x(s)}" y="15" width="${Math.max(1.5, x(e) - x(s))}" height="12" fill="var(--exon)" opacity="0.55" />`;
            // Coding part of the exon
            const [cs, ce] = [Math.max(s, t.cdsStart ?? s), Math.min(e, t.cdsEnd ?? e)];
            const cds =
              t.cdsStart != null && ce > cs
                ? `<rect x="${x(cs)}" y="10" width="${Math.max(1.5, x(ce) - x(cs))}" height="22" fill="var(--exon)" />`
                : "";
            return `<g><title>Exon ${n} · ${fmt(s)}-${fmt(e)} · ${kb(e - s)}</title>${box}${cds}</g>`;
          })
          .join("");
        return `<svg viewBox="0 0 ${W} 54" width="${W}" role="img" aria-label="Gene structure"><line x1="${x0}" x2="${x1}" y1="21" y2="21" stroke="var(--muted)" />${chevrons.join("")}${exons}
          <text x="${x0}" y="48">${fmt(t.start)}</text><text x="${x1}" y="48" text-anchor="end">${fmt(t.end)}</text>
          <text x="${(x0 + x1) / 2}" y="48" text-anchor="middle">${strand < 0 ? "&lt;- minus strand" : "plus strand -&gt;"} · ${kb(t.end - t.start)}</text></svg>`;
      }

      /** Location and structure, the drawings are made at the width of the section once laid out */
      function locationSection() {
        const loc = data.location;
        if (!loc)
          return `<section class="wide"><h2>Location</h2><div class="empty">No genomic position</div></section>`;
        const t = data.transcript;
        const coding = t?.cdsStart != null ? `coding ${kb(t.cdsEnd - t.cdsStart)} (genomic)` : "non coding";
        return `<section class="wide"><h2>Location <span>chromosome ${escapeHtml(loc.chr)}</span></h2>
          <div class="facts">
            <span>Position <b>chr${escapeHtml(loc.chr)}:${fmt(loc.start)}-${fmt(loc.end)}</b></span>
            <span>Strand <b>${loc.strand < 0 ? "minus (-)" : "plus (+)"}</b></span>
            <span>Length <b>${kb(loc.end - loc.start)}</b></span>
            ${loc.band ? `<span>Band <b>${escapeHtml(loc.band.replaceAll("|", " · "))}</b></span>` : ""}
            ${loc.assembly ? `<span>Assembly <b>${loc.assembly}</b></span>` : ""}</div>
          <div class="drawings" id="drawings"></div>
          ${t ? `<h2 class="sub-h">Gene structure <span>${escapeHtml(t.id)} · ${t.exons.length} exons · ${coding} · ${data.transcripts} transcript${data.transcripts > 1 ? "s" : ""} in total</span></h2><div id="structure"></div>` : ""}
        </section>`;
      }

      function draw() {
        const loc = data?.location;
        if (!loc || !$("drawings")) return;
        const W = Math.floor($("drawings").clientWidth);
        const chrom = data.karyotype?.[loc.chr];
        $("drawings").innerHTML = data.karyotype
          ? `<div class="karyo">${karyotypeSvg(data.karyotype, loc, Math.min(W, 820))}</div>${chromosomeSvg(chrom[0], chrom[1], loc, W)}`
          : "";
        if (data.transcript) $("structure").innerHTML = structureSvg(data.transcript, loc.strand, W);
      }

      function goSection() {
        const tiles = Object.entries(ASPECTS)
          .map(([a, name]) => {
            const terms = data.go[a] ?? [];
            return `<button type="button" data-aspect="${a}" class="${a === aspect ? "active" : ""}"><b>${terms.length}</b><span>${name}</span><span>${terms.filter((t) => t.experimental).length} experimental</span></button>`;
          })
          .join("");
        return `<section><h2>Gene Ontology</h2><div class="tiles">${tiles}</div>
          <div class="go-tools"><input id="go-filter" type="search" placeholder="Filter terms" />
            <label><input id="go-exp" type="checkbox" /> Experimental only</label></div>
          <div class="terms" id="terms"></div></section>`;
      }

      function renderTerms() {
        const text = ($("go-filter")?.value ?? "").toLowerCase();
        const exp = $("go-exp")?.checked;
        const terms = (data.go[aspect] ?? []).filter(
          (t) => (!exp || t.experimental) && (!text || `${t.id} ${t.term}`.toLowerCase().includes(text)),
        );
        $("terms").innerHTML =
          terms
            .map(
              (
                t,
              ) => `<div data-go="${t.id}" title="${escapeHtml(`${t.id} · ${t.qualifier ?? ""} · click to ask about it`)}">
                <span class="t">${escapeHtml(t.term)}</span>
                <span class="ev ${t.experimental ? "exp" : ""}">${escapeHtml(t.evidence.join(" "))}</span></div>`,
            )
            .join("") || `<div class="empty">No term</div>`;
      }

      function orthologsSection() {
        if (!data.orthologs.length)
          return `<section><h2>Orthologs</h2><div class="empty">No HomoloGene ortholog</div></section>`;
        return `<section><h2>Orthologs <span>HomoloGene</span></h2><table><thead><tr><th>Species</th><th>Gene</th><th>Name</th><th></th></tr></thead><tbody>
          ${data.orthologs
            .map(
              (
                o,
              ) => `<tr><td><span class="species">${escapeHtml(o.species)}</span>${o.commonName ? ` <span class="muted">${escapeHtml(o.commonName)}</span>` : ""}</td>
                <td><a data-url="https://www.ncbi.nlm.nih.gov/gene/${o.geneId}">${escapeHtml(o.symbol ?? o.geneId)}</a></td>
                <td>${escapeHtml(o.name ?? "")}</td>
                <td><button type="button" data-ask="${escapeHtml(`Show the gene card of ${o.symbol ?? o.geneId} (Entrez ${o.geneId}, ${o.species})`)}" title="Show its gene card">Card</button></td></tr>`,
            )
            .join("")}</tbody></table></section>`;
      }

      function summarySection() {
        const pathways = Object.entries(data.pathways)
          .map(([k, n]) => `<span><b>${n}</b> ${PATHWAYS[k] ?? k}</span>`)
          .join("");
        return `<section class="wide"><h2>Summary</h2>
          ${data.summary ? `<p class="summary" id="summary" title="Click to expand">${escapeHtml(data.summary)}</p>` : `<div class="empty">No RefSeq summary</div>`}
          <div class="chips">${data.aliases.length ? `<span>Aliases <b>${escapeHtml(data.aliases.join(", "))}</b></span>` : ""}
            ${pathways ? `<span>Pathways</span>${pathways}` : ""}</div></section>`;
      }

      function render() {
        const sp = data.commonName ? `${data.species} (${data.commonName})` : data.species;
        $("title").innerHTML = `${escapeHtml(data.symbol)} <span class="sub">${escapeHtml(data.name ?? "")}</span>`;
        $("subtitle").innerHTML =
          `<span class="species">${escapeHtml(sp ?? "")}</span> · ${escapeHtml(data.type ?? "")}`;
        $("links").innerHTML = data.links
          .map(
            (l) =>
              `<a class="logo-link" data-url="${escapeHtml(l.url)}" title="${escapeHtml(`${l.name} ${l.id}`)}">${logoHtml(l.name)}</a>`,
          )
          .join("");
        $("card").innerHTML = summarySection() + locationSection() + goSection() + orthologsSection();
        draw();
        renderTerms();
        $("go-filter").oninput = renderTerms;
        $("go-exp").onchange = renderTerms;
        $("actions").innerHTML =
          `<button type="button" class="primary" data-ask="${escapeHtml(`What are the main functions of ${data.symbol} (${data.species}) and its role in disease?`)}">Ask about ${escapeHtml(data.symbol)}</button>`;
      }

      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-url], [data-ask], [data-aspect], [data-go], #summary");
        if (!t) return;
        if (t.dataset.url) void app.openLink({ url: t.dataset.url });
        else if (t.dataset.ask) void sendMessage(t.dataset.ask);
        else if (t.id === "summary") t.classList.toggle("open");
        else if (t.dataset.aspect) {
          aspect = t.dataset.aspect;
          for (const b of document.querySelectorAll("[data-aspect]")) b.classList.toggle("active", b === t);
          renderTerms();
        } else if (t.dataset.go) {
          const term = data.go[aspect].find((x) => x.id === t.dataset.go);
          void sendMessage(`What is the role of ${data.symbol} in ${term.term} (${term.id})?`);
        }
      });

      // Drawings follow the width of the frame
      let drawnWidth = 0;
      new ResizeObserver(() => {
        if (data && document.body.clientWidth !== drawnWidth) {
          drawnWidth = document.body.clientWidth;
          requestAnimationFrame(draw);
        }
      }).observe(document.body);

      // Theme, colors and fonts of the host
      function onContext(ctx) {
        if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
        if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
        if (ctx.theme) applyDocumentTheme(ctx.theme);
      }
      app.onhostcontextchanged = onContext;
      // Tool arguments, to call the tool again when the result has no `structuredContent`, as Claude Desktop
      // gives to widgets restored after a reload of the chat
      let toolArgs;
      app.ontoolinput = (params) => (toolArgs = params.arguments);
      app.ontoolresult = async (result) => {
        if (!result.structuredContent && !result.isError && toolArgs) {
          result = await app.callServerTool({ name: "show_gene_card", arguments: toolArgs }).catch(() => result);
        }
        data = result.structuredContent;
        if (!data?.symbol) return ($("title").textContent = "No gene");
        render();
      };

      await app.connect();
      onContext(app.getHostContext() ?? {});
    </script>
  </body>
</html>
