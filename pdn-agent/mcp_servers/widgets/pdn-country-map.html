<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      /* Long filters stay on one line, in full on hover */
      #subtitle {
        flex: 1 1 0;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Sequential blue ramp, the low end recedes toward the surface */
      :root {
        --low: #cde2fb;
        --high: #0d366b;
        --land: #eeeeea;
      }
      :root[data-theme="dark"] {
        --low: #1f4a80;
        --high: #9ec5f4;
        --land: #2a2d33;
      }
      .layout {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      #map {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
      }
      #map svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .country {
        stroke: var(--bg);
        stroke-width: 0.5;
        vector-effect: non-scaling-stroke;
        cursor: pointer;
      }
      #reset {
        position: absolute;
        right: 4px;
        bottom: 4px;
        font-size: 11px;
        padding: 1px 7px;
      }
      .country.empty {
        fill: var(--land);
        cursor: default;
      }
      .country:hover,
      .country.hl {
        stroke: var(--fg);
        stroke-width: 1.2;
      }
      .country.sel {
        stroke: var(--accent);
        stroke-width: 2;
      }
      .side {
        flex: 0 0 230px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .side input {
        width: 100%;
      }
      .list {
        max-height: 330px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 12px;
      }
      :root[data-mode="fullscreen"] .list {
        max-height: calc(100vh - 170px);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        padding: 4px 8px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row:hover,
      .row.sel {
        background: var(--hover);
      }
      .row .n {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .row .bar {
        grid-column: 1 / 3;
        height: 3px;
        border-radius: 2px;
        background: var(--accent);
        opacity: 0.55;
      }
      .row small {
        color: var(--muted);
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .legend svg text {
        fill: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .tip {
        position: absolute;
        pointer-events: none;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 9px;
        font-size: 12px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        white-space: nowrap;
        display: none;
      }
      .details {
        margin-top: 8px;
        padding: 8px 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        min-height: 38px;
      }
      .details .actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      @media (max-width: 640px) {
        .layout {
          flex-direction: column;
          align-items: stretch;
        }
        .side {
          flex-basis: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Loading sequences by country</h1>
      <span class="muted" id="subtitle"></span>
      <button type="button" id="fullscreen">Full screen</button>
    </header>
    <div class="layout">
      <div id="map">
        <div class="tip" id="tip"></div>
        <button type="button" id="reset" title="Zoom with ctrl + wheel or a double click, drag to pan">
          Reset zoom
        </button>
      </div>
      <div class="side">
        <input id="filter" type="search" placeholder="Filter countries" />
        <div class="list" id="list"></div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="details muted" id="details">Hover a country for its count, click it for details</div>

    <script type="module">
      import { App, applyDocumentTheme, applyHostFonts, applyHostStyleVariables } from "@modelcontextprotocol/ext-apps";
      import { escapeHtml } from "./colors.js";
      import * as d3 from "d3";
      import * as topojson from "topojson-client";
      import topo from "world-atlas/countries-110m.json";

      // Connection to the host with the MCP Apps SDK
      const app = new App(
        { name: "LAPIS sequences by country", version: "0.0.1" },
        { availableDisplayModes: ["inline", "fullscreen"] },
      );
      const sendMessage = (text) => app.sendMessage({ role: "user", content: [{ type: "text", text }] });
      const updateContext = (text) => app.updateModelContext({ content: [{ type: "text", text }] });

      const $ = (id) => document.getElementById(id);
      // LAPIS country names differing from the world-atlas names (keys normalized by norm)
      const ALIASES = {
        usa: "United States of America",
        "united states": "United States of America",
        us: "United States of America",
        "democratic republic of the congo": "Dem. Rep. Congo",
        "dr congo": "Dem. Rep. Congo",
        drc: "Dem. Rep. Congo",
        zaire: "Dem. Rep. Congo",
        "congo democratic republic": "Dem. Rep. Congo",
        "republic of the congo": "Congo",
        "congo brazzaville": "Congo",
        "central african republic": "Central African Rep.",
        "ivory coast": "Cote d'Ivoire",
        "czech republic": "Czechia",
        "viet nam": "Vietnam",
        "south sudan": "S. Sudan",
        "bosnia and herzegovina": "Bosnia and Herz.",
        "dominican republic": "Dominican Rep.",
        "equatorial guinea": "Eq. Guinea",
        swaziland: "eSwatini",
        "solomon islands": "Solomon Is.",
        "north macedonia": "Macedonia",
        "western sahara": "W. Sahara",
        "falkland islands": "Falkland Is.",
        "russian federation": "Russia",
        "lao pdr": "Laos",
        "lao people's democratic republic": "Laos",
        "syrian arab republic": "Syria",
        "republic of korea": "South Korea",
        korea: "South Korea",
        "democratic people's republic of korea": "North Korea",
        "united republic of tanzania": "Tanzania",
        "republic of moldova": "Moldova",
        "brunei darussalam": "Brunei",
        "east timor": "Timor-Leste",
        "state of palestine": "Palestine",
        "west bank": "Palestine",
        gaza: "Palestine",
        burma: "Myanmar",
        turkiye: "Turkey",
        uk: "United Kingdom",
        "great britain": "United Kingdom",
        england: "United Kingdom",
        scotland: "United Kingdom",
        wales: "United Kingdom",
        "northern ireland": "United Kingdom",
      };
      /** Lower case, no accents, no "the", no parenthesized or comma suffix: "Iran (Islamic Republic of)" -> "iran" */
      const norm = (s) =>
        s
          .normalize("NFD")
          .replace(/\p{Diacritic}/gu, "")
          .toLowerCase()
          .replace(/\s*\(.*\)|,.*$/g, "")
          .replace(/^the\s+/, "")
          .replace(/[-_]/g, " ")
          .trim();

      let data;
      // World map, without Antarctica
      const atlas = {
        features: topojson
          .feature(topo, topo.objects.countries)
          .features.filter((f) => f.properties.name !== "Antarctica"),
      };
      let rows = [];
      let selected = null;
      let paths;
      const num = (n) => n.toLocaleString("en-US");
      const share = (n) => `${((100 * n) / data.total).toFixed(n / data.total < 0.001 ? 2 : 1)}%`;
      const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      const filtersText = () =>
        Object.entries(data.filters)
          .filter(([k]) => k !== "versionStatus" && k !== "isRevocation")
          .map(([k, v]) => `${k}=${Array.isArray(v) ? v.join("|") : v}`)
          .join(", ");

      /** Map the LAPIS countries to the atlas features, summing names that map to one feature */
      function matchCountries() {
        const byName = new Map(atlas.features.map((f) => [norm(f.properties.name), f.properties.name]));
        const counts = new Map();
        rows = data.rows.map((r) => {
          const key = norm(r.country);
          const name = byName.get(key) ?? (ALIASES[key] && byName.get(norm(ALIASES[key])));
          if (name) counts.set(name, (counts.get(name) ?? 0) + r.count);
          return { ...r, feature: name ?? null };
        });
        return counts;
      }

      function render() {
        const box = $("map");
        box.querySelector("svg")?.remove();
        const W = Math.max(300, box.clientWidth);
        const full = document.documentElement.dataset.mode === "fullscreen";
        const H = full ? Math.min(W * 0.55, innerHeight - 170) : W * 0.5;
        const counts = matchCountries();
        const max = Math.max(1, ...counts.values());
        const scale = d3
          .scaleSequentialLog(d3.interpolateLab(css("--low"), css("--high")))
          .domain([1, Math.max(2, max)]);
        const projection = d3.geoEqualEarth().fitExtent(
          [
            [4, 4],
            [W - 4, H - 4],
          ],
          { type: "FeatureCollection", features: atlas.features },
        );
        const path = d3.geoPath(projection);
        const svg = d3.select(box).insert("svg", ":first-child").attr("viewBox", `0 0 ${W} ${H}`);
        const g = svg.append("g");
        // Zoom with ctrl or cmd + wheel, double click, or pinch, pan by dragging: plain wheel keeps scrolling the chat
        const zoom = d3
          .zoom()
          .scaleExtent([1, 12])
          .translateExtent([
            [0, 0],
            [W, H],
          ])
          .filter((e) => (e.type === "wheel" ? e.ctrlKey || e.metaKey : !e.button))
          .on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);
        $("reset").onclick = () => svg.transition().call(zoom.transform, d3.zoomIdentity);
        paths = g
          .selectAll("path")
          .data(atlas.features)
          .join("path")
          .attr("d", path)
          .attr("class", (f) => `country${counts.get(f.properties.name) ? "" : " empty"}`)
          .classed("sel", (f) => selected?.feature === f.properties.name)
          .attr("fill", (f) => (counts.get(f.properties.name) ? scale(counts.get(f.properties.name)) : null))
          .on("mousemove", (e, f) => showTip(e, f.properties.name, counts.get(f.properties.name) ?? 0))
          .on("mouseleave", hideTip)
          .on("click", (_, f) => {
            const row = rows.find((r) => r.feature === f.properties.name);
            if (row) select(row);
          });
        renderLegend(scale, max);
        renderList();
      }

      /** Gradient of the log scale with ticks at powers of ten */
      function renderLegend(scale, max) {
        const w = 220;
        const stops = d3
          .range(0, 1.01, 0.1)
          .map((t) => `<stop offset="${t}" stop-color="${scale(Math.pow(Math.max(2, max), t))}" />`);
        const ticks = [1, 10, 100, 1000, 10000, 100000, 1000000].filter((t) => t <= max);
        const x = (v) => (w * Math.log(v)) / Math.log(Math.max(2, max));
        $("legend").innerHTML = `<span>Sequences</span>
          <svg width="${w + 30}" height="26"><defs><linearGradient id="g">${stops.join("")}</linearGradient></defs>
          <rect x="4" y="2" width="${w}" height="9" rx="2" fill="url(#g)" />
          ${ticks.map((t) => `<text x="${4 + x(t)}" y="23" text-anchor="middle" font-size="10">${d3.format("~s")(t)}</text>`).join("")}</svg>
          <span>${num(data.total)} sequences${data.unknown ? ` · ${num(data.unknown)} without a country` : ""}</span>`;
      }

      function renderList() {
        const text = $("filter").value.toLowerCase();
        const max = Math.max(1, ...rows.map((r) => r.count));
        $("list").innerHTML =
          rows
            .filter((r) => !text || r.country.toLowerCase().includes(text))
            .map(
              (
                r,
              ) => `<div class="row ${selected?.country === r.country ? "sel" : ""}" data-country="${escapeHtml(r.country)}">
                <span>${escapeHtml(r.country)}${r.feature ? "" : ' <small title="Too small for this map">not on map</small>'}</span>
                <span class="n">${num(r.count)} <small>${share(r.count)}</small></span>
                <span class="bar" style="width:${(100 * r.count) / max}%"></span></div>`,
            )
            .join("") || '<div class="row muted">No country</div>';
      }

      function showTip(e, name, count) {
        const tip = $("tip");
        const r = $("map").getBoundingClientRect();
        // LAPIS names of the country, several when they map to one shape, e.g. Zaire
        const names = rows.filter((row) => row.feature === name).map((row) => row.country);
        tip.innerHTML = `<b>${escapeHtml(names.join(", ") || name)}</b><br>${count ? `${num(count)} sequences · ${share(count)}` : '<span class="muted">No sequence</span>'}`;
        tip.style.display = "block";
        const x = e.clientX - r.left + 12;
        tip.style.left = `${x + tip.offsetWidth > r.width ? x - tip.offsetWidth - 24 : x}px`;
        tip.style.top = `${e.clientY - r.top + 12}px`;
      }
      function hideTip() {
        $("tip").style.display = "none";
      }

      /** Details of a country, also told to the model */
      function select(row) {
        selected = row;
        paths?.classed("sel", (f) => f.properties.name === row.feature);
        renderList();
        const where = filtersText();
        $("details").classList.remove("muted");
        $("details").innerHTML =
          `<div><b>${escapeHtml(row.country)}</b> ${num(row.count)} ${escapeHtml(data.organism)} sequences
            <span class="muted">· ${share(row.count)} of ${num(data.total)} · rank ${rows.indexOf(row) + 1} of ${rows.length}</span></div>
          <div class="actions"><button type="button" id="ask">Ask about ${escapeHtml(row.country)}</button></div>`;
        $("ask").onclick = () =>
          sendMessage(
            `What do the ${data.organism} sequences from ${row.country}${where ? ` (${where})` : ""} show, e.g. their lineages and collection dates?`,
          );
        void updateContext(
          `The user selected ${row.country} (${data.country_field}) on the map of ${data.organism} sequences` +
            `${where ? ` with filters ${where}` : ""}: ${row.count} of ${data.total} sequences`,
        );
      }

      $("list").addEventListener("click", (e) => {
        const div = e.target.closest("[data-country]");
        if (div) select(rows.find((r) => r.country === div.dataset.country));
      });
      $("list").addEventListener("mouseover", (e) => {
        const div = e.target.closest("[data-country]");
        paths?.classed(
          "hl",
          (f) => f.properties.name === rows.find((r) => r.country === div?.dataset.country)?.feature,
        );
      });
      $("list").addEventListener("mouseleave", () => paths?.classed("hl", false));
      $("filter").oninput = renderList;
      // Theme and display mode of the host as attributes on <html> for the CSS
      function onContext(ctx) {
        if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
        if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
        if (ctx.theme) applyDocumentTheme(ctx.theme);
        if (ctx.displayMode) {
          document.documentElement.dataset.mode = ctx.displayMode;
          $("fullscreen").textContent = ctx.displayMode === "fullscreen" ? "Exit full screen" : "Full screen";
        }
        if (data) render();
      }
      app.onhostcontextchanged = onContext;
      // The host answers with the mode set, it may not send a context change
      $("fullscreen").onclick = async () => {
        const mode = document.documentElement.dataset.mode === "fullscreen" ? "inline" : "fullscreen";
        onContext({ displayMode: (await app.requestDisplayMode({ mode })).mode });
      };
      let lastWidth = 0;
      new ResizeObserver(() => {
        // Only on width changes: the map height follows the width
        if (!data || $("map").clientWidth === lastWidth) return;
        lastWidth = $("map").clientWidth;
        render();
      }).observe($("map"));

      // Tool arguments, to call the tool again when the result has no `structuredContent`, as Claude Desktop
      // gives to widgets restored after a reload of the chat
      let toolArgs;
      app.ontoolinput = (params) => (toolArgs = params.arguments);
      app.ontoolresult = async (result) => {
        if (!result.structuredContent && !result.isError && toolArgs) {
          result = await app
            .callServerTool({ name: "show_lapis_country_map", arguments: toolArgs })
            .catch(() => result);
        }
        data = result.structuredContent;
        if (!data?.rows) return ($("title").textContent = "No data");
        const where = filtersText();
        $("title").textContent = `${num(data.total)} ${data.organism} sequences by country`;
        $("subtitle").title = $("subtitle").textContent =
          `${data.database} · ${data.country_field}${where ? ` · ${where}` : ""}`;
        lastWidth = $("map").clientWidth;
        render();
      };

      await app.connect();
      // Full screen button only when the host offers it
      const host = app.getHostContext() ?? {};
      $("fullscreen").hidden = Boolean(
        host.availableDisplayModes && !host.availableDisplayModes.includes("fullscreen"),
      );
      onContext(host);
    </script>
  </body>
</html>
