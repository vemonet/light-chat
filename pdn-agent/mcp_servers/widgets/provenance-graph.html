<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      .flow {
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      :root[data-mode="fullscreen"] .flow {
        max-height: calc(100vh - 70px);
        overflow-y: auto;
      }
      /* Vertical arrow between the nodes of the flow */
      .arrow {
        position: relative;
        height: 22px;
      }
      .arrow::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 2px;
        bottom: 6px;
        border-left: 2px solid var(--border);
      }
      .arrow::after {
        content: "";
        position: absolute;
        left: calc(50% - 4px);
        bottom: 2px;
        border: 5px solid transparent;
        border-top-color: var(--border);
        border-bottom: 0;
      }
      .end {
        align-self: center;
        max-width: 90%;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--panel);
        text-align: center;
      }
      .end b {
        color: var(--muted);
        font-weight: 600;
        margin-right: 4px;
      }
      .step {
        border: 1px dashed var(--border);
        border-radius: 10px;
        padding: 6px 8px 8px;
      }
      .step-label {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .cards {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .card {
        flex: 1 1 210px;
        min-width: 0;
        border: 1px solid var(--border);
        border-left: 4px solid var(--server);
        border-radius: 8px;
        padding: 6px 8px;
        background: var(--bg);
        cursor: pointer;
      }
      .card:hover {
        background: var(--hover);
      }
      .card.open {
        flex-basis: 100%;
        cursor: default;
        background: var(--bg);
      }
      .card.failed {
        border-color: #cf222e;
        border-left-color: var(--server);
      }
      .head {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--server);
      }
      .status {
        margin-left: auto;
        font-weight: 600;
      }
      .status.ok {
        color: #1a7f37;
      }
      .status.error {
        color: #cf222e;
      }
      :root[data-theme="dark"] .status.ok {
        color: #3fb950;
      }
      :root[data-theme="dark"] .status.error {
        color: #f85149;
      }
      .name {
        font: 600 12.5px var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        margin: 2px 0 4px;
        overflow-wrap: anywhere;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        font-size: 11px;
        padding: 0 6px;
        border-radius: 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip.count {
        border-color: transparent;
        background: var(--hover);
      }
      .foot {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .details {
        margin-top: 8px;
        border-top: 1px solid var(--border);
        padding-top: 6px;
      }
      .details h2 {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        margin: 8px 0 3px;
      }
      .details h2:first-child {
        margin-top: 0;
      }
      pre {
        margin: 0;
        padding: 6px 8px;
        max-height: 220px;
        overflow: auto;
        background: var(--panel);
        border-radius: 6px;
        font: 11.5px/1.4 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .urls a {
        display: block;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .actions {
        margin-top: 8px;
        display: flex;
        gap: 6px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Provenance graph</h1>
      <span class="muted" id="subtitle"></span>
      <span class="spacer"></span>
      <button type="button" id="toggle">Expand all</button>
      <button type="button" id="fullscreen">Full screen</button>
    </header>
    <div class="legend" id="legend"></div>
    <div class="flow" id="flow"></div>

    <script type="module">
      import { App, applyDocumentTheme, applyHostFonts, applyHostStyleVariables } from "@modelcontextprotocol/ext-apps";
      import { escapeHtml } from "./colors.js";

      // Connection to the host with the MCP Apps SDK
      const app = new App(
        { name: "Provenance graph", version: "0.0.1" },
        { availableDisplayModes: ["inline", "fullscreen"] },
      );
      const sendMessage = (text) => app.sendMessage({ role: "user", content: [{ type: "text", text }] });

      const $ = (id) => document.getElementById(id);
      // Colors of the MCP servers, by order of appearance
      const PALETTE = [
        "#0969da",
        "#8250df",
        "#1a7f37",
        "#bf8700",
        "#cf222e",
        "#1b7c83",
        "#bc4c00",
        "#6e7781",
        "#d63384",
      ];
      const serverColors = {};
      const serverOf = (c) => c.server ?? "unknown server";
      const colorOf = (server) => (serverColors[server] ??= PALETTE[Object.keys(serverColors).length % PALETTE.length]);
      let calls = [];
      const open = new Set();

      const short = (v, n = 40) => {
        const s = typeof v === "string" ? v : JSON.stringify(v);
        return s.length > n ? `${s.slice(0, n - 3)}...` : s;
      };
      const kchars = (n) => (n >= 1000 ? `${(n / 1000).toFixed(1)}k` : `${n}`);
      const fmt = (n) => (Number.isInteger(n) ? n.toLocaleString("en") : n.toPrecision(3));

      function card(c) {
        const isOpen = open.has(c.id);
        const args = typeof c.args === "object" && c.args ? Object.entries(c.args) : [];
        const counts = Object.entries(c.counts ?? {});
        const status = { ok: "ok", error: "retried", running: "no result" }[c.status] ?? c.status;
        let html = `<div class="card ${isOpen ? "open" : ""} ${c.status === "error" ? "failed" : ""}"
            data-id="${escapeHtml(c.id)}" style="--server:${colorOf(serverOf(c))}">
          <div class="head"><span class="dot"></span>${escapeHtml(serverOf(c))}
            <span class="status ${c.status}">${status}</span></div>
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="chips">${args
            .slice(0, isOpen ? 0 : 3)
            .map(
              ([k, v]) =>
                `<span class="chip" title="${escapeHtml(short(v, 500))}">${escapeHtml(k)}=${escapeHtml(short(v, 28))}</span>`,
            )
            .join("")}${counts
            .slice(0, 4)
            .map(([k, v]) => `<span class="chip count">${escapeHtml(k)}: ${fmt(v)}</span>`)
            .join("")}</div>
          <div class="foot">${c.urls.length ? `${c.urls.length} URL${c.urls.length > 1 ? "s" : ""} &middot; ` : ""}${kchars(c.chars)} chars returned</div>`;
        if (isOpen) {
          html += `<div class="details">
            <h2>Arguments</h2><pre>${escapeHtml(typeof c.args === "string" ? c.args : JSON.stringify(c.args, null, 2))}</pre>
            ${counts.length ? `<h2>Counts</h2><div class="chips">${counts.map(([k, v]) => `<span class="chip count">${escapeHtml(k)}: ${fmt(v)}</span>`).join("")}</div>` : ""}
            ${c.urls.length ? `<h2>URLs</h2><div class="urls">${c.urls.map((u) => `<a data-url="${escapeHtml(u)}">${escapeHtml(u)}</a>`).join("")}</div>` : ""}
            <h2>Result${c.chars > c.preview.length ? ` (first ${c.preview.length} of ${kchars(c.chars)} chars)` : ""}</h2>
            <pre>${escapeHtml(c.preview)}</pre>
            <div class="actions"><button type="button" data-ask>Ask about this call</button>
              <button type="button" data-close>Collapse</button></div>
          </div>`;
        }
        return `${html}</div>`;
      }

      function render() {
        const steps = Object.values(Object.groupBy(calls, (c) => c.step));
        let html = `<div class="end"><b>Question</b>${escapeHtml(data.question ?? "")}</div>`;
        for (const [i, list] of steps.entries()) {
          html += `<div class="arrow"></div><div class="step">
            <div class="step-label">Step ${i + 1}${list.length > 1 ? ` &middot; ${list.length} calls in parallel` : ""}</div>
            <div class="cards">${list.map(card).join("")}</div></div>`;
        }
        html += `<div class="arrow"></div><div class="end"><b>Answer</b>${escapeHtml(data.model ?? "")}</div>`;
        $("flow").innerHTML = html;
        $("toggle").textContent = open.size === calls.length ? "Collapse all" : "Expand all";
      }

      let data = {};
      $("flow").addEventListener("click", (e) => {
        const link = e.target.closest("a[data-url]");
        if (link) return void app.openLink({ url: link.dataset.url });
        const el = e.target.closest(".card");
        if (!el) return;
        const c = calls.find((x) => x.id === el.dataset.id);
        if (e.target.closest("[data-ask]"))
          return void sendMessage(
            `Explain the result of the ${c.name} call (${c.server}) with arguments ${JSON.stringify(c.args)}`,
          );
        if (e.target.closest("[data-close]")) open.delete(c.id);
        else if (open.has(c.id)) return;
        else open.add(c.id);
        render();
      });
      $("toggle").onclick = () => {
        if (open.size === calls.length) open.clear();
        else for (const c of calls) open.add(c.id);
        render();
      };
      // Theme and display mode of the host as attributes on <html> for the CSS
      function onContext(ctx) {
        if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
        if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
        if (ctx.theme) applyDocumentTheme(ctx.theme);
        if (ctx.displayMode) {
          document.documentElement.dataset.mode = ctx.displayMode;
          $("fullscreen").textContent = ctx.displayMode === "fullscreen" ? "Exit full screen" : "Full screen";
        }
      }
      app.onhostcontextchanged = onContext;
      // The host answers with the mode set, it may not send a context change
      $("fullscreen").onclick = async () => {
        const mode = document.documentElement.dataset.mode === "fullscreen" ? "inline" : "fullscreen";
        onContext({ displayMode: (await app.requestDisplayMode({ mode })).mode });
      };

      app.ontoolresult = (result) => {
        data = result.structuredContent ?? {};
        calls = data.calls ?? [];
        const servers = [...new Set(calls.map(serverOf))];
        const errors = calls.filter((c) => c.status === "error").length;
        const steps = new Set(calls.map((c) => c.step)).size;
        $("subtitle").textContent =
          `${calls.length} calls · ${steps} steps · ${servers.length} servers` + (errors ? ` · ${errors} retried` : "");
        $("legend").innerHTML = servers
          .map((s) => `<span><span class="dot" style="--server:${colorOf(s)}"></span>${escapeHtml(s)}</span>`)
          .join("");
        render();
      };

      await app.connect();
      // Full screen button only when the host offers it
      const host = app.getHostContext() ?? {};
      $("fullscreen").hidden = Boolean(
        host.availableDisplayModes && !host.availableDisplayModes.includes("fullscreen"),
      );
      onContext(host);
    </script>
  </body>
</html>
