<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
      }
      .toolbar input[type="search"] {
        flex: 1;
        min-width: 140px;
      }
      .toolbar label {
        display: flex;
        gap: 4px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .scroll {
        width: fit-content;
        max-width: 100%;
        max-height: 520px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      :root[data-mode="fullscreen"] .scroll {
        max-height: calc(100vh - 250px);
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        font-size: 12px;
      }
      th,
      td {
        padding: 0;
        background: var(--bg);
      }
      thead th {
        position: sticky;
        z-index: 2;
        font-weight: 500;
      }
      thead tr:first-child th {
        top: 0;
        height: 22px;
      }
      thead tr:nth-child(2) th {
        top: 22px;
        border-bottom: 1px solid var(--border);
        vertical-align: bottom;
      }
      /* Category bands above their workflows */
      th.cat {
        font-size: 11px;
        text-align: left;
        padding: 0 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 0;
        color: var(--fg);
        border-left: 2px solid var(--bg);
        cursor: default;
      }
      th.cat span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Workflow names written bottom to top */
      th.wf {
        cursor: pointer;
        padding: 6px 0 4px;
      }
      th.wf div {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        margin: 0 auto;
        white-space: nowrap;
        max-height: 170px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      th.wf.off div {
        color: var(--muted);
      }
      th.asm,
      td.asm {
        position: sticky;
        left: 0;
        z-index: 1;
        text-align: left;
        padding: 3px 8px;
        min-width: 230px;
        max-width: 300px;
        border-right: 1px solid var(--border);
      }
      thead th.asm {
        z-index: 3;
        color: var(--muted);
        vertical-align: bottom;
      }
      td.asm {
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 1px solid var(--border);
      }
      td.asm .sub {
        color: var(--muted);
        font-size: 11px;
      }
      .ref {
        font-size: 10px;
        font-weight: 600;
        color: #fff;
        background: #1a7f37;
        border-radius: 4px;
        padding: 0 4px;
        margin-left: 4px;
      }
      td.n {
        padding: 0 6px;
        color: var(--muted);
        text-align: right;
        border-bottom: 1px solid var(--border);
        min-width: 34px;
      }
      td.cell {
        width: 24px;
        min-width: 24px;
        height: 34px;
        text-align: center;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
      }
      td.cell i {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 3px;
        vertical-align: middle;
      }
      td.cell i.ready {
        background: var(--c);
      }
      /* Compatible but the assembly lacks the gene model the workflow needs */
      td.cell i.no_gene_model {
        border: 2px solid var(--c);
        background: repeating-linear-gradient(45deg, var(--c) 0 2px, transparent 2px 5px);
      }
      td.cell i.ploidy,
      td.cell i.taxonomy {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--border);
      }
      tbody tr:hover td,
      td.hover,
      th.hover,
      .selected {
        background-color: var(--hover);
      }
      td.cell.selected {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }
      .legend span {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .legend i {
        width: 11px;
        height: 11px;
        border-radius: 2px;
        display: inline-block;
      }
      .details {
        margin-top: 8px;
        padding: 8px 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        min-height: 38px;
      }
      .details .ok {
        color: #1a7f37;
      }
      .details .warn {
        color: #9a6700;
      }
      .details .no {
        color: #cf222e;
      }
      :root[data-theme="dark"] .details .ok {
        color: #3fb950;
      }
      :root[data-theme="dark"] .details .warn {
        color: #d29922;
      }
      :root[data-theme="dark"] .details .no {
        color: #f85149;
      }
      .details .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .details dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 1px 10px;
        margin: 4px 0 0;
        font-size: 12px;
      }
      .details dt {
        color: var(--muted);
      }
      .details dd {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Loading workflows</h1>
      <span class="muted" id="subtitle"></span>
      <span class="spacer"></span>
      <button type="button" id="site" class="logo-link" title="Open in BRC Analytics"></button>
      <button type="button" id="fullscreen">Full screen</button>
    </header>
    <div class="toolbar">
      <input id="filter" type="search" placeholder="Filter assemblies by accession, strain, species" />
      <select id="category" aria-label="Workflow category"></select>
      <label><input id="hide" type="checkbox" checked /> Hide workflows no assembly can run</label>
    </div>
    <div class="scroll">
      <table>
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="legend" id="legend"></div>
    <div class="details muted" id="details">Click a cell, an assembly or a workflow for details</div>

    <script type="module">
      import { App, applyDocumentTheme, applyHostFonts, applyHostStyleVariables } from "@modelcontextprotocol/ext-apps";
      import { escapeHtml } from "./colors.js";
      import { logoHtml } from "./logos.js";

      // Connection to the host with the MCP Apps SDK
      const app = new App(
        { name: "BRC Analytics workflow matrix", version: "0.0.1" },
        { availableDisplayModes: ["inline", "fullscreen"] },
      );
      const sendMessage = (text) => app.sendMessage({ role: "user", content: [{ type: "text", text }] });
      const updateContext = (text) => app.updateModelContext({ content: [{ type: "text", text }] });

      const $ = (id) => document.getElementById(id);
      const SITE = "https://brc-analytics.org";
      const PALETTE = ["#2e86c1", "#27ae60", "#8e44ad", "#d35400", "#c0392b", "#16a085", "#b7950b", "#5d6d7e"];
      // Names of the taxa workflows are restricted to, others are shown by ID
      const TAXA = { 2: "Bacteria", 2759: "Eukaryota", 10239: "Viruses", 131567: "cellular organisms" };
      const STATUS = {
        ready: ["ok", "Compatible, ready to run"],
        no_gene_model: ["warn", "Compatible, but needs a gene model (GTF) this assembly does not have"],
        ploidy: ["no", "Not compatible: ploidy mismatch"],
        taxonomy: ["no", "Not compatible: taxonomy mismatch"],
      };
      let data;
      let colors = {};
      let selected = null;
      let shown = { assemblies: [], workflows: [] };

      const entity = (acc) => acc.replace(/\./g, "_");
      const trs = (id) => id.replace(/^#/, "").replace(/[^a-zA-Z0-9]/g, "-");
      const urls = {
        assembly: (a) => `${SITE}/data/assemblies/${entity(a.accession)}`,
        organism: (taxid) => `${SITE}/data/organisms/${taxid}`,
        workflow: (w) => `${SITE}/data/workflows/${trs(w.trsId)}`,
        configure: (a, w) =>
          `${SITE}/data/assemblies/${entity(a.accession)}/analyze/workflows?trsId=${encodeURIComponent(trs(w.trsId))}`,
        ncbi: (a) => `https://www.ncbi.nlm.nih.gov/datasets/genome/${a.accession}/`,
      };
      const st = (a, w) => data.status[a.accession][w.index];
      const label = (a) => [a.species, a.strain].filter(Boolean).join(" ");
      // Row name: the strain, with the species when several are shown
      const name = (a) => (data.organisms.length > 1 ? label(a) : a.strain || a.species);
      const taxon = (id) => (TAXA[id] ? `${TAXA[id]} (taxon ${id})` : `NCBI taxon ${id}`);
      const reason = (a, w) =>
        ({
          ploidy: `workflow requires ${w.ploidy} genomes, the assembly is ${a.ploidy.join(", ") || "of unknown ploidy"}`,
          taxonomy: `workflow restricted to ${taxon(w.taxonomyId)}`,
        })[st(a, w)] ?? "";
      const category = (w) => w.categories[0] ?? "Other";

      /** Assemblies matching the filter, workflows of the category, grouped by category in the catalog order */
      function compute() {
        const text = $("filter").value.toLowerCase();
        const assemblies = data.assemblies.filter(
          (a) => !text || `${a.accession} ${a.species} ${a.strain ?? ""} ${a.level ?? ""}`.toLowerCase().includes(text),
        );
        const cat = $("category").value;
        const order = data.categories.map((c) => c.name);
        const workflows = data.workflows
          .filter((w) => (!cat || w.categories.includes(cat)) && (!$("hide").checked || runnable(w)))
          .map((w) => ({ ...w, group: cat || category(w) }))
          .sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group));
        shown = { assemblies, workflows };
      }
      const runnable = (w) => data.assemblies.some((a) => ["ready", "no_gene_model"].includes(st(a, w)));

      function render() {
        compute();
        const { assemblies, workflows } = shown;
        // Category bands: consecutive workflows of the same group
        const bands = [];
        for (const w of workflows) {
          if (bands.at(-1)?.name === w.group) bands.at(-1).n++;
          else bands.push({ name: w.group, n: 1 });
        }
        const isSel = (kind, id) => selected?.kind === kind && selected.id === id;
        $("head").innerHTML = `
          <tr><th class="asm" rowspan="2">${assemblies.length} of ${data.assemblyTotal} assemblies</th><th class="wf" rowspan="2" title="Workflows ready to run"><div class="muted">Ready</div></th>
            ${bands
              .map(
                (b) =>
                  `<th class="cat" colspan="${b.n}" style="background:color-mix(in srgb, ${colors[b.name]} 22%, var(--bg))" title="${escapeHtml(`${b.name}: ${data.categories.find((c) => c.name === b.name)?.description ?? ""}`)}"><span>${escapeHtml(b.name)}</span></th>`,
              )
              .join("")}</tr>
          <tr>${workflows
            .map(
              (w, i) =>
                `<th class="wf ${runnable(w) ? "" : "off"} ${isSel("workflow", w.iwcId) ? "selected" : ""}" data-wf="${escapeHtml(w.iwcId)}" data-i="${i}" title="${escapeHtml(`${w.name}\n${w.description}`)}"><div>${escapeHtml(w.name)}</div></th>`,
            )
            .join("")}</tr>`;
        $("rows").innerHTML =
          assemblies
            .map((a) => {
              const ready = workflows.filter((w) => st(a, w) === "ready").length;
              return `<tr data-acc="${escapeHtml(a.accession)}">
                <td class="asm ${isSel("assembly", a.accession) ? "selected" : ""}" title="${escapeHtml(`${a.accession} · ${label(a)} · ${a.level ?? ""}`)}">
                  <div>${escapeHtml(name(a))}${a.isRef ? '<span class="ref">REF</span>' : ""}</div>
                  <div class="sub">${escapeHtml(a.accession)} · ${escapeHtml(a.level ?? "")}</div></td>
                <td class="n" title="Workflows ready to run">${ready}</td>
                ${workflows
                  .map((w, i) => {
                    const s = st(a, w);
                    const sel = isSel("cell", `${a.accession} ${w.iwcId}`) ? "selected" : "";
                    const tip = `${w.name}\non ${a.accession} (${label(a)})\n${STATUS[s][1]}${reason(a, w) ? `: ${reason(a, w)}` : ""}`;
                    return `<td class="cell ${sel}" data-wf="${escapeHtml(w.iwcId)}" data-i="${i}" style="--c:${colors[w.group]}" title="${escapeHtml(tip)}"><i class="${s}"></i></td>`;
                  })
                  .join("")}</tr>`;
            })
            .join("") || `<tr><td class="asm muted" colspan="2">No assembly matches the filter</td></tr>`;
      }

      function renderLegend() {
        const c = "var(--muted)";
        $("legend").innerHTML = [
          `<span><i style="background:${c}"></i>Ready to run</span>`,
          `<span><i style="border:2px solid ${c};background:repeating-linear-gradient(45deg, ${c} 0 2px, transparent 2px 5px)"></i>Needs a gene model the assembly lacks</span>`,
          `<span><i style="width:5px;height:5px;border-radius:50%;background:var(--border)"></i>Not compatible (ploidy or taxonomy)</span>`,
          `<span><span class="ref">REF</span> Reference genome</span>`,
          ...data.categories.map(
            (c) => `<span><i style="background:${colors[c.name]}"></i>${escapeHtml(c.name)}</span>`,
          ),
        ].join("");
      }

      const link = (url, text) => `<a data-url="${escapeHtml(url)}">${escapeHtml(text)}</a>`;
      const mb = (n) => (n ? `${(n / 1e6).toFixed(2)} Mb` : "");
      const button = (id, text, primary) =>
        `<button type="button" id="${id}" class="${primary ? "primary" : ""}">${text}</button>`;

      /** Details of a cell, an assembly or a workflow, also told to the model */
      function select(kind, a, w) {
        selected = {
          kind,
          id: kind === "cell" ? `${a.accession} ${w.iwcId}` : kind === "assembly" ? a.accession : w.iwcId,
        };
        render();
        const box = $("details");
        box.classList.remove("muted");
        if (kind === "cell") {
          const s = st(a, w);
          const [cls, text] = STATUS[s];
          box.innerHTML = `
            <div><b>${escapeHtml(w.name)}</b> on <b>${escapeHtml(a.accession)}</b> <span class="muted">${escapeHtml(label(a))}</span></div>
            <div class="${cls}">${escapeHtml(text)}${reason(a, w) ? `: ${escapeHtml(reason(a, w))}` : ""}</div>
            <dl><dt>Inputs</dt><dd>${escapeHtml(w.inputs.join(", ") || "-")}</dd>
              <dt>Category</dt><dd>${escapeHtml(w.categories.join(", "))}</dd></dl>
            <div class="actions">${button("ask", s === "ready" || s === "no_gene_model" ? "Ask how to run it" : "Ask about alternatives", true)}
              ${s === "ploidy" || s === "taxonomy" ? "" : button("configure", "Configure on BRC Analytics")}
              ${button("workflow", "Workflow page")}</div>`;
          $("ask").onclick = () =>
            sendMessage(
              s === "ready" || s === "no_gene_model"
                ? `How do I run the BRC Analytics workflow "${w.name}" (${w.iwcId}) on the ${label(a)} assembly ${a.accession}? Which sequencing data can I use as input?`
                : `The BRC Analytics workflow "${w.name}" (${w.iwcId}) is not compatible with the ${label(a)} assembly ${a.accession} (${reason(a, w)}). Which workflow can I use instead?`,
            );
          if ($("configure")) $("configure").onclick = () => app.openLink({ url: urls.configure(a, w) });
          $("workflow").onclick = () => app.openLink({ url: urls.workflow(w) });
          void updateContext(
            `The user selected the BRC Analytics workflow "${w.name}" (${w.iwcId}) on assembly ${a.accession} (${label(a)}): ${text}${reason(a, w) ? `, ${reason(a, w)}` : ""}`,
          );
        } else if (kind === "assembly") {
          const ready = data.workflows.filter((x) => st(a, x) === "ready");
          box.innerHTML = `
            <div><b>${escapeHtml(label(a))}</b> ${link(urls.assembly(a), a.accession)}${a.isRef ? '<span class="ref">REF</span>' : ""}</div>
            <dl><dt>Level</dt><dd>${escapeHtml(a.level ?? "-")}</dd>
              <dt>Size</dt><dd>${mb(a.length)}${a.gcPercent ? ` · GC ${a.gcPercent}%` : ""}${a.scaffolds ? ` · ${a.scaffolds} scaffolds` : ""}</dd>
              <dt>Ploidy</dt><dd>${escapeHtml(a.ploidy.join(", ") || "-")}</dd>
              <dt>Gene model</dt><dd>${a.geneModel ? "Yes" : "No"}</dd>
              <dt>Taxonomy</dt><dd>${link(`https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=${a.taxonomyId}`, a.taxonomyId)}</dd>
              <dt>Ready</dt><dd>${ready.length} workflows: ${escapeHtml(ready.map((x) => x.name).join(", ") || "none")}</dd>
              <dt>Links</dt><dd>${[link(urls.assembly(a), "BRC Analytics"), link(urls.ncbi(a), "NCBI"), a.ucscUrl ? link(a.ucscUrl, "UCSC browser") : ""].filter(Boolean).join(" · ")}</dd></dl>
            <div class="actions">${button("ask", "Ask about it", true)}</div>`;
          $("ask").onclick = () =>
            sendMessage(
              `Which analyses can I run on the ${label(a)} assembly ${a.accession} in BRC Analytics, and with which data?`,
            );
          void updateContext(
            `The user selected the BRC Analytics assembly ${a.accession} (${label(a)}, ${a.level}${a.isRef ? ", reference" : ""}), ready to run ${ready.length} workflows`,
          );
        } else {
          const ok = data.assemblies.filter((x) => st(x, w) === "ready");
          const restriction = [
            w.ploidy && w.ploidy !== "ANY" ? `${w.ploidy} genomes` : "",
            w.taxonomyId ? taxon(w.taxonomyId) : "",
          ];
          box.innerHTML = `
            <div><b>${escapeHtml(w.name)}</b> <span class="muted">${escapeHtml(w.categories.join(", "))}</span></div>
            <div>${escapeHtml(w.description)}</div>
            <dl><dt>Inputs</dt><dd>${escapeHtml(w.inputs.join(", ") || "-")}</dd>
              <dt>Restricted to</dt><dd>${escapeHtml(restriction.filter(Boolean).join(", ") || "any genome")}</dd>
              <dt>Ready on</dt><dd>${ok.length} of ${data.assemblies.length} assemblies</dd></dl>
            <div class="actions">${button("ask", "Ask about it", true)} ${button("workflow", "Workflow page")}</div>`;
          $("ask").onclick = () =>
            sendMessage(
              `What does the BRC Analytics workflow "${w.name}" (${w.iwcId}) do, and on which ${data.organisms.map((o) => o.species).join(", ")} assemblies can I run it?`,
            );
          $("workflow").onclick = () => app.openLink({ url: urls.workflow(w) });
          void updateContext(
            `The user selected the BRC Analytics workflow "${w.name}" (${w.iwcId}), ready on ${ok.length} assemblies`,
          );
        }
      }

      const byAcc = (acc) => data.assemblies.find((a) => a.accession === acc);
      const byId = (id) => data.workflows.find((w) => w.iwcId === id);
      $("rows").addEventListener("click", (e) => {
        const tr = e.target.closest("tr[data-acc]");
        if (!tr) return;
        const cell = e.target.closest("td.cell");
        if (cell) select("cell", byAcc(tr.dataset.acc), byId(cell.dataset.wf));
        else if (e.target.closest("td.asm")) select("assembly", byAcc(tr.dataset.acc));
      });
      $("head").addEventListener("click", (e) => {
        const th = e.target.closest("th[data-wf]");
        if (th) select("workflow", null, byId(th.dataset.wf));
      });
      // Highlight the workflow column of the hovered cell
      $("rows").addEventListener("mouseover", (e) => {
        const cell = e.target.closest("td.cell");
        for (const el of document.querySelectorAll(".hover")) el.classList.remove("hover");
        if (cell) document.querySelector(`th.wf[data-i="${cell.dataset.i}"]`)?.classList.add("hover");
      });
      $("details").addEventListener("click", (e) => {
        const url = e.target.closest("[data-url]")?.dataset.url;
        if (url) void app.openLink({ url });
      });
      $("filter").oninput = render;
      $("category").onchange = render;
      $("hide").onchange = render;
      $("site").innerHTML = logoHtml("BRC Analytics");
      $("site").onclick = () =>
        data &&
        app.openLink({
          url: data.organisms.length === 1 ? urls.organism(data.organisms[0].taxonomyId) : `${SITE}/data/organisms`,
        });
      // Theme and display mode of the host as attributes on <html> for the CSS
      function onContext(ctx) {
        if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
        if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
        if (ctx.theme) applyDocumentTheme(ctx.theme);
        if (ctx.displayMode) {
          document.documentElement.dataset.mode = ctx.displayMode;
          $("fullscreen").textContent = ctx.displayMode === "fullscreen" ? "Exit full screen" : "Full screen";
        }
      }
      app.onhostcontextchanged = onContext;
      // The host answers with the mode set, it may not send a context change
      $("fullscreen").onclick = async () => {
        const mode = document.documentElement.dataset.mode === "fullscreen" ? "inline" : "fullscreen";
        onContext({ displayMode: (await app.requestDisplayMode({ mode })).mode });
      };

      // Tool arguments, to call the tool again when the result has no `structuredContent`, as Claude Desktop
      // gives to widgets restored after a reload of the chat
      let toolArgs;
      app.ontoolinput = (params) => (toolArgs = params.arguments);
      app.ontoolresult = async (result) => {
        if (!result.structuredContent && !result.isError && toolArgs) {
          result = await app
            .callServerTool({ name: "show_brc_workflow_matrix", arguments: toolArgs })
            .catch(() => result);
        }
        data = result.structuredContent;
        if (!data) return ($("title").textContent = "No workflows");
        data.workflows.forEach((w, i) => (w.index = i));
        colors = Object.fromEntries(data.categories.map((c, i) => [c.name, PALETTE[i % PALETTE.length]]));
        const species = data.organisms.map((o) => o.species);
        $("title").textContent =
          `Workflows for ${species.length > 2 ? `${data.query} (${species.length} species)` : species.join(", ")}`;
        const runnableCount = data.workflows.filter(runnable).length;
        $("subtitle").textContent =
          `${data.assemblyTotal} assemblies · ${runnableCount} of ${data.workflows.length} workflows compatible`;
        $("category").innerHTML =
          `<option value="">All categories</option>` +
          data.categories.map((c) => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join("");
        renderLegend();
        render();
      };

      await app.connect();
      // Full screen button only when the host offers it
      const host = app.getHostContext() ?? {};
      $("fullscreen").hidden = Boolean(
        host.availableDisplayModes && !host.availableDisplayModes.includes("fullscreen"),
      );
      onContext(host);
    </script>
  </body>
</html>
