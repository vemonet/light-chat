<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
      }
      .toolbar input[type="search"] {
        flex: 1;
        min-width: 120px;
      }
      .toolbar input[type="number"] {
        width: 64px;
      }
      .toolbar label {
        display: flex;
        gap: 4px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .scroll {
        max-height: 470px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      :root[data-mode="fullscreen"] .scroll {
        max-height: calc(100vh - 200px);
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        font-size: 12px;
        min-width: 100%;
      }
      th,
      td {
        padding: 0;
        background: var(--bg);
      }
      thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        vertical-align: bottom;
        border-bottom: 1px solid var(--border);
        padding: 6px 6px 4px;
        font-weight: 600;
        text-align: center;
        min-width: 84px;
        max-width: 130px;
        cursor: pointer;
      }
      thead th .muted {
        display: block;
        font-weight: 400;
        font-size: 11px;
      }
      th.gene,
      td.gene {
        position: sticky;
        left: 0;
        z-index: 1;
        text-align: left;
        padding: 0 10px;
        min-width: 150px;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        border-right: 1px solid var(--border);
        cursor: pointer;
      }
      thead th.gene {
        z-index: 3;
        color: var(--muted);
        font-weight: 500;
        cursor: default;
      }
      td.cell {
        height: 22px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        border: 1px solid var(--bg);
        cursor: pointer;
      }
      td.cell.dark {
        color: #fff;
      }
      td.cell.zero {
        color: var(--muted);
        opacity: 0.5;
      }
      td.cell:hover,
      td.cell.selected {
        outline: 2px solid var(--fg);
        outline-offset: -2px;
      }
      tbody tr:hover td.gene,
      tr.selected td.gene,
      th.selected {
        background-color: var(--hover);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }
      .legend .ramp {
        width: 140px;
        height: 10px;
        border-radius: 2px;
        background: linear-gradient(to right, transparent, var(--accent));
        border: 1px solid var(--border);
      }
      .tooltip {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        max-width: 280px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }
      .details {
        margin-top: 8px;
        padding: 8px 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        min-height: 38px;
      }
      .details .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Loading AMR genes</h1>
      <span class="muted" id="subtitle"></span>
      <span class="spacer"></span>
      <button type="button" id="fullscreen">Full screen</button>
    </header>
    <div class="toolbar">
      <select id="mode" aria-label="Value shown">
        <option value="share">Share of isolates</option>
        <option value="count">Number of isolates</option>
      </select>
      <select id="sort" aria-label="Gene order">
        <option value="share">Most prevalent</option>
        <option value="count">Most isolates</option>
        <option value="name">Gene name</option>
      </select>
      <input id="filter" type="search" placeholder="Filter genes, e.g. KPC" />
      <label>Top <input id="top" type="number" min="1" value="40" /></label>
    </div>
    <div class="scroll">
      <table>
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="legend" id="legend"></div>
    <div class="details muted" id="details">Click a cell to ask about a gene in an organism</div>
    <div class="tooltip" id="tooltip" hidden></div>

    <script src="colors.js"></script>
    <script type="module">
      import {
        App,
        applyDocumentTheme,
      } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@2.0.3/dist/src/app-with-deps.js";

      // Connection to the host with the MCP Apps SDK
      const app = new App(
        { name: "AMR gene heatmap", version: "0.0.1" },
        { availableDisplayModes: ["inline", "fullscreen"] },
      );
      const sendMessage = (text) => app.sendMessage({ role: "user", content: [{ type: "text", text }] });
      const updateContext = (text) => app.updateModelContext({ content: [{ type: "text", text }] });

      const $ = (id) => document.getElementById(id);
      let data;
      let shown = [];
      // Selected cell: gene index in data.genes and organism index, organism -1 for a whole gene row
      let selected = null;

      const share = (g, o) => (data.organisms[o].isolates ? g.counts[o] / data.organisms[o].isolates : 0);
      const pct = (x) =>
        x === 0 ? "0%" : x < 0.001 ? "<0.1%" : x < 0.1 ? `${(x * 100).toFixed(1)}%` : `${Math.round(x * 100)}%`;
      const num = (n) => n.toLocaleString();
      const maxShare = (g) => Math.max(...g.counts.map((_, o) => share(g, o)));
      const total = (g) => g.counts.reduce((a, b) => a + b, 0);

      /** Genes matching the filter, sorted, cut to the top N */
      function compute() {
        const text = $("filter").value.toLowerCase();
        const key = { share: maxShare, count: total }[$("sort").value];
        let genes = data.genes.map((g, i) => ({ ...g, i })).filter((g) => !text || g.gene.toLowerCase().includes(text));
        genes.sort((a, b) => (key ? key(b) - key(a) : a.gene.localeCompare(b.gene)));
        shown = genes;
        return genes.slice(0, Math.max(1, Number($("top").value) || 40));
      }

      /** Cell fill: share of isolates, or isolates on a log scale relative to the largest count */
      function intensity(g, o) {
        if ($("mode").value === "share") return Math.sqrt(share(g, o));
        const max = Math.max(...data.genes.flatMap((x) => x.counts));
        return g.counts[o] ? Math.log1p(g.counts[o]) / Math.log1p(max) : 0;
      }

      function render() {
        const genes = compute();
        const mode = $("mode").value;
        const more = shown.length > genes.length ? `${genes.length} of ${shown.length} genes` : `${shown.length} genes`;
        $("head").innerHTML = `<tr><th class="gene">${more}</th>${data.organisms
          .map(
            (o, j) =>
              `<th data-org="${j}" class="${selected?.org === j ? "selected" : ""}" title="${escapeHtml(o.name)}">${escapeHtml(o.name)}<span class="muted">${num(o.isolates)} isolates</span></th>`,
          )
          .join("")}</tr>`;
        $("rows").innerHTML =
          genes
            .map(
              (g) => `<tr class="${selected?.gene === g.i && selected.org < 0 ? "selected" : ""}" data-gene="${g.i}">
                <td class="gene" title="${escapeHtml(g.gene)}">${escapeHtml(g.gene)}</td>
                ${data.organisms
                  .map((_, o) => {
                    const v = intensity(g, o);
                    const cls = [
                      "cell",
                      v > 0.55 ? "dark" : "",
                      g.counts[o] ? "" : "zero",
                      selected?.gene === g.i && selected.org === o ? "selected" : "",
                    ].join(" ");
                    const fill = v
                      ? `background:color-mix(in srgb, var(--accent) ${Math.round(v * 100)}%, transparent)`
                      : "";
                    const label = !g.counts[o] ? "·" : mode === "share" ? pct(share(g, o)) : num(g.counts[o]);
                    return `<td class="${cls}" style="${fill}" data-org="${o}">${label}</td>`;
                  })
                  .join("")}</tr>`,
            )
            .join("") || `<tr><td class="gene muted">No gene matches the filter</td></tr>`;
        $("legend").innerHTML =
          mode === "share"
            ? `<span>0%</span><span class="ramp"></span><span>100% of the isolates of the organism</span>`
            : `<span>0</span><span class="ramp"></span><span>${num(Math.max(...data.genes.flatMap((x) => x.counts)))} isolates (log scale)</span>`;
        $("legend").insertAdjacentHTML("beforeend", `<span>· approximate counts (index rows / 2)</span>`);
      }

      const cellText = (g, o) =>
        `${g.gene} in ${data.organisms[o].name}: ${num(g.counts[o])} of ${num(data.organisms[o].isolates)} isolates (${pct(share(g, o))})`;

      /** Details of a cell, or of a gene across organisms, also told to the model */
      function select(gene, org) {
        selected = { gene, org };
        render();
        const g = data.genes[gene];
        const across = data.organisms.map((o, j) => `${o.name}: ${pct(share(g, j))} (${num(g.counts[j])})`).join(" · ");
        $("details").classList.remove("muted");
        if (org >= 0) {
          const name = data.organisms[org].name;
          $("details").innerHTML = `<div><b>${escapeHtml(g.gene)}</b> in <b>${escapeHtml(name)}</b>:
              ${num(g.counts[org])} of ${num(data.organisms[org].isolates)} isolates (${pct(share(g, org))})</div>
            <div class="muted">${escapeHtml(across)}</div>
            <div class="actions"><button type="button" id="ask">Ask about it</button>
              <button type="button" id="isolates">Show these isolates</button></div>`;
          $("ask").onclick = () =>
            sendMessage(
              `What is ${g.gene} and what does it mean that about ${pct(share(g, org))} of ${name} isolates ` +
                `(${num(g.counts[org])}) carry it in NCBI Pathogen Detection?`,
            );
          $("isolates").onclick = () => sendMessage(`Show the ${name} isolates carrying ${g.gene} in a table`);
          void updateContext(`The user selected in the AMR heatmap: ${cellText(g, org)}. Across organisms: ${across}`);
        } else {
          $("details").innerHTML = `<div><b>${escapeHtml(g.gene)}</b> across organisms</div>
            <div class="muted">${escapeHtml(across)}</div>
            <div class="actions"><button type="button" id="ask">Compare across organisms</button></div>`;
          $("ask").onclick = () =>
            sendMessage(`Why does the prevalence of ${g.gene} differ between these organisms: ${across}?`);
          void updateContext(`The user selected the gene ${g.gene} in the AMR heatmap. ${across}`);
        }
      }

      $("rows").addEventListener("click", (e) => {
        const tr = e.target.closest("tr[data-gene]");
        if (!tr) return;
        const td = e.target.closest("td[data-org]");
        select(Number(tr.dataset.gene), td ? Number(td.dataset.org) : -1);
      });
      $("head").addEventListener("click", (e) => {
        const th = e.target.closest("th[data-org]");
        if (!th) return;
        const o = data.organisms[th.dataset.org];
        const top = compute()
          .filter((g) => g.counts[th.dataset.org])
          .sort((a, b) => b.counts[th.dataset.org] - a.counts[th.dataset.org])
          .slice(0, 10)
          .map((g) => `${g.gene} ${pct(share(g, th.dataset.org))}`);
        $("details").classList.remove("muted");
        $("details").innerHTML = `<div><b>${escapeHtml(o.name)}</b> · ${num(o.isolates)} isolates</div>
          <div class="muted">Most frequent: ${escapeHtml(top.join(", ") || "none")}</div>`;
        void updateContext(`The user looked at ${o.name} in the AMR heatmap, most frequent genes: ${top.join(", ")}`);
      });

      // Hover details next to the pointer
      $("rows").addEventListener("mousemove", (e) => {
        const td = e.target.closest("td[data-org]");
        const tr = e.target.closest("tr[data-gene]");
        if (!td || !tr) return void ($("tooltip").hidden = true);
        const g = data.genes[tr.dataset.gene];
        const o = Number(td.dataset.org);
        $("tooltip").innerHTML = `<b>${escapeHtml(g.gene)}</b> · ${escapeHtml(data.organisms[o].name)}<br />
          ${num(g.counts[o])} of ${num(data.organisms[o].isolates)} isolates (${pct(share(g, o))})`;
        $("tooltip").hidden = false;
        const { width, height } = $("tooltip").getBoundingClientRect();
        $("tooltip").style.left = `${Math.min(e.clientX + 12, innerWidth - width - 4)}px`;
        $("tooltip").style.top = `${Math.min(e.clientY + 12, innerHeight - height - 4)}px`;
      });
      $("rows").addEventListener("mouseleave", () => ($("tooltip").hidden = true));

      for (const id of ["mode", "sort", "top"]) $(id).onchange = render;
      $("filter").oninput = render;
      // Theme and display mode of the host as attributes on <html> for the CSS
      function onContext(ctx) {
        if (ctx.theme) applyDocumentTheme(ctx.theme);
        if (ctx.displayMode) {
          document.documentElement.dataset.mode = ctx.displayMode;
          $("fullscreen").textContent = ctx.displayMode === "fullscreen" ? "Exit full screen" : "Full screen";
        }
      }
      app.onhostcontextchanged = onContext;
      // The host answers with the mode set, it may not send a context change
      $("fullscreen").onclick = async () => {
        const mode = document.documentElement.dataset.mode === "fullscreen" ? "inline" : "fullscreen";
        onContext({ displayMode: (await app.requestDisplayMode({ mode })).mode });
      };

      // Tool arguments, to call the tool again when the result has no `structuredContent`, as Claude Desktop
      // gives to widgets restored after a reload of the chat
      let toolArgs;
      app.ontoolinput = (params) => (toolArgs = params.arguments);
      app.ontoolresult = async (result) => {
        if (!result.structuredContent && !result.isError && toolArgs) {
          result = await app.callServerTool({ name: "show_amr_heatmap", arguments: toolArgs }).catch(() => result);
        }
        data = result.structuredContent;
        if (!data) return ($("title").textContent = "No AMR genes");
        $("title").textContent = `AMR genes in ${data.organisms.length} organism groups`;
        const filter = data.filter ? `matching "${data.filter}" · ` : "";
        const loaded = data.totalGenes > data.genes.length ? ` (${data.genes.length} most prevalent loaded)` : "";
        $("subtitle").textContent = `${filter}${data.totalGenes} genes${loaded} · NCBI Pathogen Detection`;
        $("top").value = data.topN;
        render();
      };

      await app.connect();
      // Full screen button only when the host offers it
      const host = app.getHostContext() ?? {};
      $("fullscreen").hidden = Boolean(
        host.availableDisplayModes && !host.availableDisplayModes.includes("fullscreen"),
      );
      onContext(host);
    </script>
  </body>
</html>
