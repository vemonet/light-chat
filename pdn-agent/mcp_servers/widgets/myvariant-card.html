<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      :root {
        --pathogenic: #cf222e;
        --likely: #e16f24;
        --uncertain: #bf8700;
        --benign: #1a7f37;
        --genome: #4c8bf5;
        --exome: #9c5fd6;
      }
      :root[data-theme="dark"] {
        --pathogenic: #f85149;
        --likely: #f0883e;
        --uncertain: #d29922;
        --benign: #3fb950;
      }
      header h1 .id {
        font-weight: 400;
        color: var(--muted);
        font-size: 13px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
        font-size: 12px;
      }
      .tabs button {
        font-size: 12px;
        padding: 2px 10px;
      }
      .tabs button.active {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--hover);
      }
      .note {
        padding: 6px 10px;
        margin-bottom: 10px;
        border-radius: 6px;
        background: color-mix(in srgb, var(--uncertain) 14%, transparent);
        font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 10px;
      }
      section {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        background: var(--panel);
        min-width: 0;
      }
      section h2 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      section h2 a {
        text-transform: none;
        letter-spacing: 0;
        font-weight: 400;
      }
      dl {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 3px 12px;
        margin: 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .mono {
        font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        font-size: 12px;
      }
      .badge {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        background: var(--muted);
      }
      .sig {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .sig .badge {
        font-size: 14px;
        padding: 3px 12px;
        border-radius: 14px;
      }
      .stars {
        color: #d4a72c;
        letter-spacing: 1px;
        font-size: 14px;
      }
      .counts {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      td,
      th {
        text-align: left;
        padding: 3px 6px 3px 0;
        border-top: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 500;
        border-top: 0;
      }
      td .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
      }
      td.stars {
        font-size: 11px;
        white-space: nowrap;
      }
      .more {
        margin-top: 4px;
        font-size: 12px;
      }
      /* Allele frequency bars, genomes and exomes per population */
      .freq-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 12px;
        margin-bottom: 8px;
      }
      .freq-summary i,
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 4px;
        vertical-align: -1px;
      }
      .freqs {
        display: grid;
        grid-template-columns: minmax(80px, max-content) minmax(60px, 1fr) 62px;
        gap: 1px 8px;
        align-items: center;
        font-size: 12px;
      }
      .freqs .bars {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 2px 0;
      }
      .freqs .bars span {
        height: 6px;
        border-radius: 0 3px 3px 0;
        min-width: 1px;
      }
      .freqs .val {
        text-align: right;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
        font-size: 11px;
      }
      .legend {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
        white-space: nowrap;
      }
      /* Prediction gauges: colored zones by threshold, marker at the score */
      .pred {
        margin-bottom: 8px;
      }
      .pred .line {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
      }
      .pred .line b {
        font-weight: 600;
      }
      .gauge {
        position: relative;
        height: 8px;
        border-radius: 4px;
        overflow: visible;
        display: flex;
        margin-top: 3px;
      }
      .gauge .zone {
        height: 100%;
        opacity: 0.35;
      }
      .gauge .zone:first-child {
        border-radius: 4px 0 0 4px;
      }
      .gauge .zone:last-child {
        border-radius: 0 4px 4px 0;
      }
      .gauge .marker {
        position: absolute;
        top: -3px;
        width: 4px;
        height: 14px;
        margin-left: -2px;
        border-radius: 2px;
        background: var(--fg);
        box-shadow: 0 0 0 2px var(--panel);
      }
      .actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .empty {
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Loading the variant</h1>
      <span class="spacer"></span>
      <div class="links" id="links"></div>
    </header>
    <div class="tabs" id="tabs"></div>
    <div id="note"></div>
    <div class="grid" id="card"></div>
    <div class="actions" id="actions"></div>

    <script src="colors.js"></script>
    <script src="logos.js"></script>
    <script type="module">
      import {
        App,
        applyDocumentTheme,
        applyHostFonts,
        applyHostStyleVariables,
      } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@2.0.3/dist/src/app-with-deps.js";

      // Connection to the host with the MCP Apps SDK
      const app = new App(
        { name: "MyVariant card", version: "0.0.1" },
        { availableDisplayModes: ["inline", "fullscreen"] },
      );
      const sendMessage = (text) => app.sendMessage({ role: "user", content: [{ type: "text", text }] });
      const updateContext = (text) => app.updateModelContext({ content: [{ type: "text", text }] });

      const $ = (id) => document.getElementById(id);
      const LEVEL_COLORS = { damaging: "var(--pathogenic)", uncertain: "var(--uncertain)", benign: "var(--benign)" };
      let data;
      let current = 0;
      let allRecords = false;

      /** Color of a ClinVar significance */
      function sigColor(s) {
        s = (s ?? "").toLowerCase();
        if (s.includes("conflicting") || s.includes("uncertain")) return "var(--uncertain)";
        if (s.includes("likely pathogenic")) return "var(--likely)";
        if (s.includes("pathogenic")) return "var(--pathogenic)";
        if (s.includes("benign")) return "var(--benign)";
        return "var(--muted)";
      }
      const stars = (n) =>
        `<span class="stars" title="${n} of 4 review stars">${"&#9733;".repeat(n)}${"&#9734;".repeat(4 - n)}</span>`;
      /** Allele frequency, readable from 0.5 to 1e-6 */
      const fmtAf = (af) => (af == null ? "-" : af === 0 ? "0" : af >= 0.001 ? af.toPrecision(3) : af.toExponential(2));
      const fmtInt = (n) => (n == null ? "-" : n.toLocaleString("en-US"));
      const shortP = (v) => v.hgvsP ?? v.hgvsC ?? (v.ref && v.alt ? `${v.ref}>${v.alt}` : "");

      function summary(v) {
        const rows = [
          ["Location", `chr${v.chrom}:${v.pos ?? "?"} <span class="muted">(${v.assembly}, VCF)</span>`],
          ["GRCh38 / hg19", `${v.hg38 ?? "-"} / ${v.hg19 ?? "-"}`],
          ["Ref / Alt", `<span class="mono">${escapeHtml(v.ref ?? "-")} / ${escapeHtml(v.alt ?? "-")}</span>`],
          ["Type", escapeHtml(v.type ?? "-")],
          [
            "Consequence",
            `${escapeHtml(v.consequence ?? "-")}${v.impact ? ` <span class="muted">· ${escapeHtml(v.impact.toLowerCase())} impact</span>` : ""}`,
          ],
          ["HGVS", `<span class="mono">${escapeHtml([v.hgvsC, v.hgvsP].filter(Boolean).join(" · ") || "-")}</span>`],
          ["Transcript", escapeHtml(v.transcript ?? "-")],
        ];
        if (v.uniprot)
          rows.push([
            "UniProt",
            `<a data-url="https://www.uniprot.org/uniprotkb/${encodeURIComponent(v.uniprot)}/entry">${escapeHtml(v.uniprot)}</a>`,
          ]);
        return `<section><h2>Variant</h2><dl>${rows.map(([k, val]) => `<dt>${k}</dt><dd>${val}</dd>`).join("")}</dl></section>`;
      }

      function clinvar(v) {
        const cv = v.clinvar;
        if (!cv) return `<section><h2>ClinVar</h2><div class="empty">Not in ClinVar</div></section>`;
        const records = allRecords ? cv.records : cv.records.slice(0, 6);
        const counts = Object.entries(cv.counts)
          .map(([s, n]) => `<span><i class="dot" style="background:${sigColor(s)}"></i>${escapeHtml(s)} ${n}</span>`)
          .join(" · ");
        return `<section>
          <h2>ClinVar ${cv.url ? `<a data-url="${cv.url}">Variation ${cv.variantId}</a>` : ""}</h2>
          <div class="sig"><span class="badge" style="background:${sigColor(cv.significance)}">${escapeHtml(cv.significance)}</span>
            ${stars(cv.stars)} <span class="muted">best review status</span></div>
          <div class="counts">${cv.records.length} records: ${counts}</div>
          <table><thead><tr><th>Significance</th><th>Condition</th><th>Review</th></tr></thead><tbody>
          ${records
            .map(
              (
                r,
              ) => `<tr title="${escapeHtml(`${r.accession} · ${r.reviewStatus} · last evaluated ${r.lastEvaluated ?? "-"} · ${r.submitters ?? "?"} submitters`)}">
                <td><span class="dot" style="background:${sigColor(r.significance)}"></span>${escapeHtml(r.significance)}</td>
                <td>${escapeHtml(r.condition)}</td><td class="stars">${stars(r.stars)}</td></tr>`,
            )
            .join("")}</tbody></table>
          ${cv.records.length > 6 ? `<div class="more"><a id="toggle-records">${allRecords ? "Show fewer" : `Show all ${cv.records.length} records`}</a></div>` : ""}
        </section>`;
      }

      function gnomad(v) {
        const sets = ["genome", "exome"].filter((k) => v.gnomad[k]);
        if (!sets.length) return `<section><h2>gnomAD</h2><div class="empty">Not in gnomAD</div></section>`;
        const pops = {};
        for (const k of sets) for (const p of v.gnomad[k].populations) (pops[p.code] ??= { name: p.name })[k] = p.af;
        const rows = Object.values(pops).sort(
          (a, b) => Math.max(b.genome ?? 0, b.exome ?? 0) - Math.max(a.genome ?? 0, a.exome ?? 0),
        );
        const max = Math.max(...rows.flatMap((r) => [r.genome ?? 0, r.exome ?? 0]), 1e-9);
        const color = { genome: "var(--genome)", exome: "var(--exome)" };
        const link = v.links.gnomAD ? `<a data-url="${v.links.gnomAD}">Browser</a>` : "";
        return `<section><h2>gnomAD allele frequencies ${link}</h2>
          <div class="freq-summary">${sets
            .map((k) => {
              const f = v.gnomad[k];
              return `<span><i style="background:${color[k]}"></i><b>${k}s</b> AF ${fmtAf(f.af)} · ${fmtInt(f.ac)} / ${fmtInt(f.an)} alleles · ${fmtInt(f.hom)} homozygotes</span>`;
            })
            .join("")}</div>
          <div class="freqs">${rows
            .map(
              (r) => `<span>${escapeHtml(r.name)}</span>
                <span class="bars">${sets.map((k) => `<span style="width:${((r[k] ?? 0) / max) * 100}%;background:${color[k]}" title="${k}s ${fmtAf(r[k])}"></span>`).join("")}</span>
                <span class="val">${sets.map((k) => fmtAf(r[k])).join("<br />")}</span>`,
            )
            .join("")}</div>
        </section>`;
      }

      /** Gauge zones from the thresholds, colored by level in the direction of the score */
      function gauge(p) {
        const bounds = [p.min, ...p.thresholds, p.max];
        const zoneLevels = !p.higherIsWorse
          ? ["damaging", "benign"]
          : p.thresholds.length === 1
            ? ["benign", "damaging"]
            : ["benign", "uncertain", "damaging"];
        const zones = bounds
          .slice(0, -1)
          .map(
            (b, i) =>
              `<span class="zone" style="width:${((bounds[i + 1] - b) / (p.max - p.min)) * 100}%;background:${LEVEL_COLORS[zoneLevels[i]]}"></span>`,
          )
          .join("");
        const at = Math.min(100, Math.max(0, ((p.score - p.min) / (p.max - p.min)) * 100));
        return `<div class="pred"><div class="line"><span><b>${escapeHtml(p.name)}</b> ${p.score.toPrecision(3)}</span>
          <span style="color:${LEVEL_COLORS[p.level]}">${escapeHtml(p.label)}</span></div>
          <div class="gauge" title="Thresholds ${p.thresholds.join(", ")}">${zones}<span class="marker" style="left:${at}%"></span></div></div>`;
      }

      function predictions(v) {
        return `<section><h2>Predictions</h2>${
          v.predictions.length
            ? v.predictions.map(gauge).join("") +
              `<div class="legend"><span><i style="background:var(--benign);opacity:.5"></i>benign</span><span><i style="background:var(--uncertain);opacity:.5"></i>uncertain</span><span><i style="background:var(--pathogenic);opacity:.5"></i>damaging</span><span>most severe of the transcripts</span></div>`
            : `<div class="empty">No missense prediction (CADD, SIFT, PolyPhen-2, REVEL, AlphaMissense) for this variant</div>`
        }</section>`;
      }

      function render() {
        const v = data.variants[current];
        $("title").innerHTML =
          `${escapeHtml(v.gene ?? "Variant")} ${escapeHtml(shortP(v))} <span class="id">${escapeHtml(v.id)}${v.rsid ? ` · ${escapeHtml(v.rsid)}` : ""}</span>`;
        $("links").innerHTML = Object.entries(v.links)
          .map(
            ([name, url]) =>
              `<a class="logo-link" data-url="${escapeHtml(url)}" title="${escapeHtml(name)}">${logoHtml(name)}</a>`,
          )
          .join("");
        $("tabs").innerHTML =
          data.variants.length > 1
            ? `<span class="muted" style="align-self:center">Alleles:</span>` +
              data.variants
                .map(
                  (a, i) =>
                    `<button type="button" data-i="${i}" class="${i === current ? "active" : ""}">${escapeHtml(a.id.split(":").pop())}${a.clinvar ? ` <span class="badge" style="background:${sigColor(a.clinvar.significance)}">ClinVar</span>` : ""}</button>`,
                )
                .join("")
            : "";
        $("note").innerHTML = data.note && current === 0 ? `<div class="note">${escapeHtml(data.note)}</div>` : "";
        $("card").innerHTML = summary(v) + clinvar(v) + gnomad(v) + predictions(v);
        const label = `${v.gene ?? ""} ${shortP(v)} (${v.rsid ?? v.id})`.trim();
        $("actions").innerHTML =
          `<button type="button" class="primary" data-ask="${escapeHtml(`What is the clinical and functional impact of the variant ${label}?`)}">Ask about this variant</button>
          ${v.gene ? `<button type="button" data-ask="${escapeHtml(`Which other variants of ${v.gene} are pathogenic, and in which diseases?`)}">Other ${escapeHtml(v.gene)} variants</button>` : ""}`;
      }

      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-url], [data-ask], [data-i], #toggle-records");
        if (!t) return;
        if (t.dataset.url) void app.openLink({ url: t.dataset.url });
        else if (t.dataset.ask) void sendMessage(t.dataset.ask);
        else if (t.id === "toggle-records") {
          allRecords = !allRecords;
          render();
        } else {
          current = Number(t.dataset.i);
          render();
          const v = data.variants[current];
          void updateContext(
            `The user switched the variant card to ${v.id} (${v.rsid ?? "no rsID"}, ${v.gene ?? ""} ${shortP(v)}): ` +
              `ClinVar ${v.clinvar?.significance ?? "none"}, gnomAD genome AF ${fmtAf(v.gnomad.genome?.af)}`,
          );
        }
      });

      // Theme, colors and fonts of the host
      function onContext(ctx) {
        if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
        if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
        if (ctx.theme) applyDocumentTheme(ctx.theme);
      }
      app.onhostcontextchanged = onContext;
      // Tool arguments, to call the tool again when the result has no `structuredContent`, as Claude Desktop
      // gives to widgets restored after a reload of the chat
      let toolArgs;
      app.ontoolinput = (params) => (toolArgs = params.arguments);
      app.ontoolresult = async (result) => {
        if (!result.structuredContent && !result.isError && toolArgs) {
          result = await app.callServerTool({ name: "show_variant_card", arguments: toolArgs }).catch(() => result);
        }
        data = result.structuredContent;
        if (!data?.variants?.length) return ($("title").textContent = "No variant");
        render();
      };

      await app.connect();
      onContext(app.getHostContext() ?? {});
    </script>
  </body>
</html>
