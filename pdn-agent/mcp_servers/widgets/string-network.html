<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        margin-bottom: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .toolbar label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .toolbar input[type="range"] {
        width: 120px;
        padding: 0;
        accent-color: var(--accent);
      }
      .toolbar b {
        color: var(--fg);
        font-weight: 600;
        min-width: 30px;
      }
      #graph {
        height: 460px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
      }
      :root[data-mode="fullscreen"] #graph {
        height: calc(100vh - 250px);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 6px;
        margin-top: 8px;
        font-size: 12px;
      }
      .legend button {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 1px 8px;
        border-radius: 12px;
        font-size: 12px;
      }
      .legend button.off {
        opacity: 0.4;
        text-decoration: line-through;
      }
      .legend i {
        width: 14px;
        height: 3px;
        border-radius: 2px;
      }
      .legend .count {
        color: var(--muted);
      }
      .details {
        margin-top: 8px;
        padding: 8px 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        /* Room for the details of a protein, so the frame does not resize on hover */
        min-height: 150px;
      }
      .details .annotation {
        margin: 4px 0;
        max-height: 62px;
        overflow-y: auto;
      }
      .details .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .details .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: -1px;
      }
      /* Score of each evidence channel of an interaction */
      .channels {
        display: grid;
        grid-template-columns: repeat(2, 90px minmax(60px, 180px) 40px);
        gap: 2px 8px;
        align-items: center;
        margin-top: 4px;
        font-size: 12px;
      }
      @media (max-width: 560px) {
        .channels {
          grid-template-columns: 90px minmax(60px, 1fr) 40px;
        }
      }
      .channels .bar {
        height: 8px;
        border-radius: 4px;
        background: var(--border);
        overflow: hidden;
      }
      .channels .bar span {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Loading the STRING network</h1>
      <span class="muted" id="subtitle"></span>
      <span class="spacer"></span>
      <a id="string-link">Open in STRING</a>
      <button type="button" id="fullscreen">Full screen</button>
    </header>
    <div class="toolbar">
      <label>Min. score <input id="score" type="range" min="0" max="1" step="0.01" /> <b id="score-value"></b></label>
      <label
        >Color by
        <select id="color-by">
          <option value="cluster">Cluster</option>
          <option value="query">Queried or added</option>
        </select></label
      >
      <button type="button" id="relayout">Re-layout</button>
      <span class="spacer"></span>
      <span id="stats"></span>
    </div>
    <div id="graph"></div>
    <div class="legend" id="legend"></div>
    <div class="details muted" id="details">Hover or click a protein or an interaction for details</div>

    <script src="colors.js"></script>
    <script src="bridge.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.33.1/dist/cytoscape.min.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      // Evidence channel colors, close to the STRING ones
      const CHANNELS = {
        experiments: ["#d6336c", "Experiments"],
        databases: ["#1aa2b8", "Databases"],
        textmining: ["#9bbb1e", "Text mining"],
        coexpression: ["#8c959f", "Coexpression"],
        neighborhood: ["#2f9e44", "Neighborhood"],
        fusion: ["#e8590c", "Gene fusion"],
        cooccurrence: ["#3b5bdb", "Co-occurrence"],
      };
      const CLUSTER_COLORS = [
        "#4c8bf5",
        "#f08c00",
        "#2b9e5a",
        "#e5484d",
        "#9c5fd6",
        "#12a4b5",
        "#d6409f",
        "#8d7a3a",
        "#6b8e23",
        "#7c6ff0",
      ];
      let data, cy;
      const hidden = new Set();
      let selected = null;
      const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      const names = () => Object.fromEntries(data.nodes.map((n) => [n.id, n.name]));

      /** Cytoscape style, from the theme colors */
      function style() {
        const [fg, bg, accent] = ["--fg", "--bg", "--accent"].map(css);
        return [
          {
            selector: "node",
            style: {
              "background-color": "data(color)",
              label: "data(name)",
              color: fg,
              "font-size": 12,
              "font-weight": 600,
              "text-valign": "bottom",
              "text-margin-y": 3,
              "text-outline-color": bg,
              "text-outline-width": 2,
              width: "data(size)",
              height: "data(size)",
              "border-width": 1,
              "border-color": bg,
            },
          },
          // Queried proteins outlined when partners were added
          { selector: "node[?query].outlined", style: { "border-width": 2.5, "border-color": fg } },
          {
            selector: "edge",
            style: {
              "line-color": "data(color)",
              width: "mapData(score, 0.15, 1, 1, 4.5)",
              opacity: "mapData(score, 0.15, 1, 0.25, 0.75)",
              "curve-style": "haystack",
            },
          },
          // Interactions between clusters, fainter so clusters stand out
          { selector: "edge.between", style: { opacity: "mapData(score, 0.15, 1, 0.12, 0.4)" } },
          { selector: ".faded", style: { opacity: 0.08 } },
          { selector: "edge.focus", style: { opacity: 0.9 } },
          { selector: "node.selected", style: { "border-color": accent, "border-width": 4 } },
          {
            selector: "edge.selected",
            style: { opacity: 1, "underlay-color": accent, "underlay-opacity": 0.35, "underlay-padding": 3 },
          },
        ];
      }

      /** Louvain communities maximizing modularity, weighted by `weight(edge)`: community index of each node.
       * Markov clustering puts everything in one cluster in hub dominated networks, like a protein and its partners */
      function communities(ids, edges, weight) {
        const at = new Map(ids.map((id, i) => [id, i]));
        let adj = ids.map(() => new Map());
        for (const e of edges) {
          const [a, b, w] = [at.get(e.source), at.get(e.target), weight(e)];
          adj[a].set(b, (adj[a].get(b) ?? 0) + w);
          adj[b].set(a, (adj[b].get(a) ?? 0) + w);
        }
        let membership = ids.map((_, i) => i);
        for (;;) {
          // Move each node to the neighbor community with the best modularity gain, until stable
          const k = adj.map((row) => [...row.values()].reduce((s, w) => s + w, 0));
          const m2 = k.reduce((s, x) => s + x, 0) || 1;
          const comm = adj.map((_, i) => i);
          const tot = [...k];
          let improved = false;
          for (let moved = true; moved;) {
            moved = false;
            for (let i = 0; i < adj.length; i++) {
              const links = new Map();
              for (const [j, w] of adj[i]) if (j !== i) links.set(comm[j], (links.get(comm[j]) ?? 0) + w);
              tot[comm[i]] -= k[i];
              let best = comm[i];
              let bestGain = (links.get(best) ?? 0) - (tot[best] * k[i]) / m2;
              for (const [c, w] of links) {
                const gain = w - (tot[c] * k[i]) / m2;
                if (gain > bestGain + 1e-9) [best, bestGain] = [c, gain];
              }
              tot[best] += k[i];
              if (best !== comm[i]) [comm[i], moved, improved] = [best, true, true];
            }
          }
          if (!improved) return membership;
          // Communities become the nodes of the next level
          const index = new Map();
          for (const c of comm) if (!index.has(c)) index.set(c, index.size);
          membership = membership.map((c) => index.get(comm[c]));
          const next = [...index.keys()].map(() => new Map());
          adj.forEach((row, i) => {
            for (const [j, w] of row) {
              const [a, b] = [index.get(comm[i]), index.get(comm[j])];
              next[a].set(b, (next[a].get(b) ?? 0) + w);
            }
          });
          adj = next;
        }
      }

      /** Graph of the interactions above the score, of the channels shown, proteins clustered */
      function build() {
        const min = Number($("score").value);
        const edges = data.edges.filter((e) => e.score >= min && !hidden.has(e.channel));
        const degree = {};
        for (const e of edges) for (const id of [e.source, e.target]) degree[id] = (degree[id] ?? 0) + 1;
        const maxDegree = Math.max(1, ...Object.values(degree));
        // Clusters numbered by size, proteins alone left grey. Scores to the 4th power, to favor strong links
        const ids = data.nodes.map((n) => n.id);
        const membership = communities(ids, edges, (e) => e.score ** 4);
        const sizes = {};
        for (const c of membership) sizes[c] = (sizes[c] ?? 0) + 1;
        const ranks = Object.keys(sizes)
          .filter((c) => sizes[c] > 1)
          .sort((a, b) => sizes[b] - sizes[a]);
        const cluster = Object.fromEntries(ids.map((id, i) => [id, ranks.indexOf(String(membership[i])) + 1]));
        cy?.destroy();
        cy = cytoscape({
          container: $("graph"),
          elements: [
            ...data.nodes.map((n) => ({
              data: {
                ...n,
                degree: degree[n.id] ?? 0,
                cluster: cluster[n.id],
                size: 18 + 18 * Math.sqrt((degree[n.id] ?? 0) / maxDegree),
              },
            })),
            ...edges.map((e, i) => ({ data: { ...e, id: `e${i}`, color: CHANNELS[e.channel][0] } })),
          ],
          style: style(),
          wheelSensitivity: 0.3,
          minZoom: 0.2,
          maxZoom: 4,
        });
        if (data.nodes.some((n) => !n.query)) cy.nodes().addClass("outlined");
        cy.edges()
          .filter((e) => e.source().data("cluster") !== e.target().data("cluster") || !e.source().data("cluster"))
          .addClass("between");
        colorNodes();
        layout();
        bindEvents();
        $("stats").textContent =
          `${data.nodes.length} proteins · ${edges.length} interactions · ${ranks.length} cluster${ranks.length === 1 ? "" : "s"}`;
        renderLegend(min);
        if (selected) select(selected.group, selected.id, true);
      }

      function colorNodes() {
        const byQuery = $("color-by").value === "query";
        const grey = css("--muted");
        cy.nodes().forEach((n) => {
          const c = n.data("cluster");
          n.data(
            "color",
            byQuery
              ? n.data("query")
                ? css("--accent")
                : grey
              : c
                ? CLUSTER_COLORS[(c - 1) % CLUSTER_COLORS.length]
                : grey,
          );
        });
      }

      /** Each cluster laid out on its own, clusters side by side in rows, then proteins alone in a grid */
      function layout() {
        const groups = {};
        cy.nodes().forEach((n) => (groups[n.data("cluster")] ??= []).push(n));
        const keys = Object.keys(groups)
          .map(Number)
          .sort((a, b) => (a || Infinity) - (b || Infinity));
        const side = (k) => (k ? 62 * Math.sqrt(groups[k].length) + 30 : 60 * Math.ceil(Math.sqrt(groups[k].length)));
        // Row width giving about the aspect ratio of the container
        const el = $("graph");
        const area = keys.reduce((s, k) => s + (side(k) + 40) ** 2, 0);
        const rowWidth = Math.max(...keys.map(side), 1.3 * Math.sqrt((area * el.clientWidth) / el.clientHeight));
        let [x, y, rowHeight] = [0, 0, 0];
        for (const k of keys) {
          const w = side(k);
          if (x > 0 && x + w > rowWidth) [x, y, rowHeight] = [0, y + rowHeight + 40, 0];
          const nodes = cy.collection(groups[k]);
          const box = { x1: x, y1: y, w, h: w };
          const options = k
            ? { name: "cose", randomize: true, nodeRepulsion: () => 6000, idealEdgeLength: () => 50, gravity: 0.8 }
            : { name: "grid", avoidOverlap: true };
          nodes
            .union(nodes.edgesWith(nodes))
            .layout({ ...options, animate: false, boundingBox: box, padding: 0 })
            .run();
          [x, rowHeight] = [x + w + 40, Math.max(rowHeight, w)];
        }
        fit();
      }

      /** Fit the graph, without zooming small networks too much */
      function fit() {
        cy.fit(undefined, 24);
        if (cy.zoom() > 1.4) {
          cy.zoom(1.4);
          cy.center();
        }
      }

      /** Channel legend, clicking a channel hides its interactions */
      function renderLegend(min) {
        const counts = {};
        for (const e of data.edges) if (e.score >= min) counts[e.channel] = (counts[e.channel] ?? 0) + 1;
        $("legend").innerHTML =
          `<span class="muted" style="align-self:center">Main evidence:</span>` +
          Object.entries(CHANNELS)
            .filter(([c]) => counts[c])
            .map(
              ([c, [color, label]]) =>
                `<button type="button" data-channel="${c}" class="${hidden.has(c) ? "off" : ""}" title="Show or hide these interactions">
                  <i style="background:${color}"></i>${label} <span class="count">${counts[c]}</span></button>`,
            )
            .join("");
      }

      /** Bars of the channels with evidence */
      const scoreRows = (scores) =>
        Object.entries(CHANNELS)
          .filter(([c]) => scores[c] > 0)
          .map(
            ([c, [color, label]]) => `<span>${label}</span>
              <span class="bar"><span style="width:${(scores[c] ?? 0) * 100}%;background:${color}"></span></span>
              <span class="muted">${(scores[c] ?? 0).toFixed(3)}</span>`,
          )
          .join("");

      /** Details of a protein or an interaction, `quiet` for hover (no model context) */
      function select(group, id, quiet = false) {
        const el = cy.getElementById(id);
        if (!el.length) return;
        cy.elements().removeClass("selected faded focus");
        el.addClass("selected");
        const n = names();
        $("details").classList.remove("muted");
        if (group === "nodes") {
          const d = el.data();
          const partners = el
            .connectedEdges()
            .sort((a, b) => b.data("score") - a.data("score"))
            .map(
              (e) =>
                `${n[e.data("source") === id ? e.data("target") : e.data("source")]} (${e.data("score").toFixed(3)})`,
            );
          cy.elements().not(el.closedNeighborhood()).addClass("faded");
          el.connectedEdges().addClass("focus");
          $("details").innerHTML = `
            <div><span class="dot" style="background:${d.color}"></span><b>${escapeHtml(d.name)}</b>
              <span class="muted">${escapeHtml(d.id)} · ${d.query ? "queried" : "added partner"} · ${d.degree} interactions${d.cluster ? ` · cluster ${d.cluster}` : ""}</span></div>
            <div class="annotation">${escapeHtml(d.annotation)}</div>
            ${partners.length ? `<div class="muted">Partners: ${escapeHtml(partners.slice(0, 20).join(", "))}${partners.length > 20 ? ", ..." : ""}</div>` : ""}
            <div class="actions">
              <button type="button" class="primary" data-ask="${escapeHtml(
                `What is known about ${d.name} (${data.organism}) and its interactions with ${
                  partners
                    .slice(0, 8)
                    .map((p) => p.split(" ")[0])
                    .join(", ") || "other proteins"
                }?`,
              )}">Ask about ${escapeHtml(d.name)}</button>
              <button type="button" data-url="https://string-db.org/network/${encodeURIComponent(d.id)}">STRING page</button>
              <button type="button" data-url="https://www.uniprot.org/uniprotkb?query=${encodeURIComponent(`gene_exact:${d.name} AND organism_id:${data.species}`)}">UniProt</button>
            </div>`;
          if (!quiet)
            void mcpApp.context(
              `The user selected ${d.name} (${d.id}) in the STRING network: ${d.degree} interactions${
                d.cluster
                  ? `, cluster ${d.cluster} with ${cy
                      .nodes()
                      .filter((x) => x.data("cluster") === d.cluster)
                      .map((x) => x.data("name"))
                      .join(", ")}`
                  : ""
              }`,
            );
        } else {
          const d = el.data();
          const [a, b] = [n[d.source], n[d.target]];
          cy.elements().not(el.union(el.connectedNodes())).addClass("faded");
          $("details").innerHTML = `
            <div><b>${escapeHtml(a)} - ${escapeHtml(b)}</b> <span class="muted">combined score ${d.score.toFixed(3)} · main evidence ${CHANNELS[d.channel][1].toLowerCase()}</span></div>
            <div class="channels">${scoreRows(d.scores)}</div>
            <div class="actions">
              <button type="button" class="primary" data-ask="${escapeHtml(`What is the evidence for the interaction between ${a} and ${b} (${data.organism}), and its biological role?`)}">Ask about this interaction</button>
              <button type="button" data-url="https://string-db.org/interaction/${encodeURIComponent(d.source)}/${encodeURIComponent(d.target)}">STRING evidence</button>
            </div>`;
          if (!quiet)
            void mcpApp.context(
              `The user selected the STRING interaction ${a} - ${b}: combined score ${d.score}, ` +
                Object.entries(d.scores)
                  .filter(([, s]) => s > 0)
                  .map(([c, s]) => `${c} ${s}`)
                  .join(", "),
            );
        }
      }

      function clearSelection() {
        selected = null;
        cy.elements().removeClass("selected faded focus");
        $("details").classList.add("muted");
        $("details").textContent = "Hover or click a protein or an interaction for details";
      }

      function bindEvents() {
        cy.on("mouseover", "node, edge", (e) => !selected && select(e.target.group(), e.target.id(), true));
        cy.on("mouseout", "node, edge", () => !selected && clearSelection());
        cy.on("tap", "node, edge", (e) => {
          selected = { group: e.target.group(), id: e.target.id() };
          select(selected.group, selected.id);
        });
        cy.on("tap", (e) => e.target === cy && clearSelection());
      }

      $("score").oninput = () => ($("score-value").textContent = Number($("score").value).toFixed(2));
      $("score").onchange = build;
      $("color-by").onchange = () => {
        colorNodes();
        renderLegend(Number($("score").value));
      };
      $("relayout").onclick = layout;
      $("legend").addEventListener("click", (e) => {
        const c = e.target.closest("button[data-channel]")?.dataset.channel;
        if (!c) return;
        hidden.has(c) ? hidden.delete(c) : hidden.add(c);
        build();
      });
      $("details").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (b?.dataset.url) void mcpApp.openLink(b.dataset.url);
        if (b?.dataset.ask) void mcpApp.message(b.dataset.ask);
      });
      $("string-link").onclick = () => data && mcpApp.openLink(data.url);
      $("fullscreen").onclick = () =>
        mcpApp.displayMode(document.documentElement.dataset.mode === "fullscreen" ? "inline" : "fullscreen");
      mcpApp.on("hostContext", (ctx) => {
        if (ctx.displayMode)
          $("fullscreen").textContent = ctx.displayMode === "fullscreen" ? "Exit full screen" : "Full screen";
        // Theme or size changed: restyle and fit the graph
        if (cy)
          requestAnimationFrame(() => {
            cy.style(style());
            colorNodes();
            cy.resize();
            fit();
          });
      });

      mcpApp.on("result", (result) => {
        data = result.structuredContent;
        if (!data?.nodes?.length) return ($("title").textContent = "No STRING network");
        const queried = data.nodes.filter((n) => n.query).map((n) => n.name);
        $("title").textContent =
          queried.length === 1
            ? `${queried[0]} and its STRING partners`
            : `STRING network of ${queried.length} proteins`;
        const p =
          data.pValue == null
            ? ""
            : ` · PPI enrichment p-value ${data.pValue ? data.pValue.toExponential(1) : "< 1e-16"}`;
        const missing = data.missing.length ? ` · not found: ${data.missing.join(", ")}` : "";
        $("subtitle").textContent = `${data.organism ?? data.species} · ${data.networkType}${p}${missing}`;
        $("score").min = data.minScore;
        $("score").value = data.minScore;
        $("score-value").textContent = data.minScore.toFixed(2);
        if (typeof cytoscape === "undefined") {
          $("graph").innerHTML = `<p class="error" style="padding:10px">Could not load Cytoscape.js</p>`;
          return;
        }
        build();
      });
      mcpApp.start("STRING network");
    </script>
  </body>
</html>
