# Demo server with OpenRouter models, the OpenRouter key is in `server/.env` (OPENAI_API_KEY): docker compose up -d --build
name: light-chat
services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    # Override `.env`, with the default OpenRouter models
    environment:
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      # Public hostname behind the reverse proxy, accepted by `/mcp`
      # ALLOWED_HOSTS: chat.example.org
    ports:
      - "8083:8000"
    restart: unless-stopped
