# Demo server with OpenRouter models, the OpenRouter key is in `server/.env` (OPENAI_API_KEY): docker compose up -d --build
name: light-chat
services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      ALLOWED_HOSTS: biosoda.unil.ch
    ports:
      - "8083:8000"
    restart: unless-stopped
